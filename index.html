<script type="module">
// ---- geometry.js ----
// 純粋関数のみ。座標系: 的中心が原点、的半径=1.0、右が+x、下が+y（射手から的を正面に見た向き）
const HIT_RADIUS = 1.0, BOUNDARY_BAND = 0.10, MAX_ABS = 10, VIEW_HALF = 2.0;
const EPS = 1e-12;
const radius = (x, y) => Math.hypot(x, y);
const isHit = (x, y, hitR = HIT_RADIUS) => radius(x, y) <= hitR + EPS; // 円周を含む
const isNearBoundary = (x, y, hitR = HIT_RADIUS) => Math.abs(radius(x, y) - hitR) <= BOUNDARY_BAND + EPS; // 注意表示のみ
function validatePosition(x, y) {
  if (!Number.isFinite(x) || !Number.isFinite(y)) return { ok: false, reason: '座標が数値ではないため保存しません' };
  if (Math.abs(x) > MAX_ABS || Math.abs(y) > MAX_ABS) return { ok: false, reason: `|x|または|y|が${MAX_ABS}を超えるため、誤入力防止で保存しません` };
  return { ok: true };
}
// 画面座標(px,py) → 保存座標。rectは正方形のSVG要素のgetBoundingClientRect()。flipは表示だけの左右反転
function pointToWorld(px, py, rect, { half = VIEW_HALF, flip = false } = {}) {
  const sx = ((px - rect.left) / rect.width * 2 - 1) * half;
  return { x: flip ? 0 - sx : sx, y: ((py - rect.top) / rect.height * 2 - 1) * half };
}
function worldToPoint(x, y, rect, { half = VIEW_HALF, flip = false } = {}) {
  const sx = flip ? 0 - x : x;
  return { px: rect.left + (sx / half + 1) / 2 * rect.width, py: rect.top + (y / half + 1) / 2 * rect.height };
}

// ---- store.js ----
const SHOTS = 4;
const clone = o => JSON.parse(JSON.stringify(o));
// 射レコード: null=未入力 / {status:'located',x,y} / {status:'unlocated_miss'}。的中/外れは座標から算出し保存しない
function createStore(members, init = {}) {
  const s = { members, records: {}, mi: 0, sel: 0 };
  for (const m of members) s.records[m.id] = init[m.id] ? clone(init[m.id]) : Array(SHOTS).fill(null);
  const undoStack = [], subs = [];
  const emit = (dirty = false) => subs.forEach(f => f(s, dirty));
  const rec = () => s.records[members[s.mi].id];
  const firstEmpty = a => { const k = a.indexOf(null); return k < 0 ? null : k; };
  const snap = () => clone({ records: s.records, mi: s.mi, sel: s.sel });
  const push = p => { if (JSON.stringify(p.records) !== JSON.stringify(s.records)) undoStack.push(p); };
  s.sel = firstEmpty(rec());
  return {
    state: s, snap, canUndo: () => undoStack.length > 0,
    subscribe: f => subs.push(f),
    restore(p) { Object.assign(s, clone(p)); emit(true); },
    select(i) { s.sel = i; emit(); },
    place(i, x, y) { const v = validatePosition(x, y); if (!v.ok) return v; rec()[i] = { status: 'located', x, y }; emit(); return v; },
    settle(before) { push(before); s.sel = firstEmpty(rec()); emit(true); }, // タップ/ドラッグ確定。Undoは1件
    unlocated(i) { const p = snap(); rec()[i] = { status: 'unlocated_miss' }; push(p); s.sel = firstEmpty(rec()); emit(true); },
    remove(i) { if (!rec()[i]) return false; const p = snap(); rec()[i] = null; push(p); s.sel = i; emit(true); return true; },
    undo() { const p = undoStack.pop(); if (p) this.restore(p); return !!p; },
    goto(k) { if (k < 0 || k >= members.length) return false; s.mi = k; s.sel = firstEmpty(rec()); emit(); return true; },
    next() { return this.goto(s.mi + 1); }, prev() { return this.goto(s.mi - 1); },
  };
}
// 的中率の分母は記録済みの射数（未入力は含めない。位置不明の外れは含める）
const statsOf = arr => { const d = arr.filter(Boolean); return { recorded: d.length, hits: d.filter(r => r.status === 'located' && isHit(r.x, r.y)).length }; };
const totalStats = recs => Object.values(recs).map(statsOf).reduce((a, b) => ({ recorded: a.recorded + b.recorded, hits: a.hits + b.hits }), { recorded: 0, hits: 0 });

// ---- db.js ----
// DB v2（STEP 2-A）。DB名は STEP 1 から変更しない。
const NAME = 'kyudo-hit-position', VERSION = 2, SESSION = 'test-session';

// 移行は versionchange トランザクション内で実行される。例外が出たら abort し、DBは移行前のまま残る
const migrations = {
  1(db) { db.createObjectStore('shots', { keyPath: 'id' }); db.createObjectStore('meta', { keyPath: 'key' }); },
  2(db, tx) { // STEP 1のテスト用shotsは破棄してよい（承認済み）。metaには触れない
    const shots = tx.objectStore('shots');
    shots.clear();
    shots.createIndex('byMember', 'memberId');
    db.createObjectStore('members', { keyPath: 'id' });
  },
};

// opts: { idb, name, version, migrations, hooks:{afterMigrate(v,db,tx)}（テスト用）, onBlocked(), onVersionChange() }
const openDb = (opts = {}) => new Promise((res, rej) => {
  const { idb = globalThis.indexedDB, name = NAME, version = VERSION, migrations: mg = migrations, hooks = {}, onBlocked, onVersionChange } = opts;
  let failure = null;
  const q = idb.open(name, version);
  q.onupgradeneeded = e => {
    try {
      for (let v = e.oldVersion + 1; v <= e.newVersion; v++) {
        mg[v](q.result, q.transaction);
        if (hooks.afterMigrate) hooks.afterMigrate(v, q.result, q.transaction);
      }
    } catch (err) { failure = err; try { q.transaction.abort(); } catch {} } // 全体を破棄し、中途半端なDB状態を残さない
  };
  // blocked: 他の接続が閉じるまで待つ。即座には失敗にせず、呼び出し側のタイムアウトに任せる
  q.onblocked = () => { if (onBlocked) onBlocked(); };
  q.onsuccess = () => {
    const d = q.result;
    d.onversionchange = () => { try { d.close(); } catch {} if (onVersionChange) onVersionChange(); };
    res(d);
  };
  q.onerror = () => rej(failure || q.error);
});

const done = tx => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = tx.onabort = () => rej(tx.error || new Error('トランザクションが中止されました')); });

// memberIds を渡したときは、その部員の射だけを返す（非表示部員の記録は読まない）
async function loadShots(db, memberIds) {
  const want = memberIds ? new Set(memberIds) : null;
  const tx = db.transaction('shots'), q = tx.objectStore('shots').getAll(); await done(tx);
  const out = {};
  for (const r of q.result) if (r.sessionId === SESSION && (!want || want.has(r.memberId)))
    (out[r.memberId] || (out[r.memberId] = Array(SHOTS).fill(null)))[r.shotIndex] = r.status === 'located' ? { status: 'located', x: r.x, y: r.y } : { status: 'unlocated_miss' };
  return out;
}

const okShot = r => r === null || (!!r && ((r.status === 'located' && Number.isFinite(r.x) && Number.isFinite(r.y)) || r.status === 'unlocated_miss'));
function validateByMember(byMember) {
  if (!byMember || typeof byMember !== 'object') throw new TypeError('保存対象の部員が指定されていません');
  const ids = Object.keys(byMember);
  if (!ids.length) throw new TypeError('保存対象の部員が空です');
  for (const id of ids) {
    if (!id || id.includes(':')) throw new TypeError(`部員IDが不正です: ${id}`);
    const a = byMember[id];
    if (!Array.isArray(a) || a.length !== SHOTS || !a.every(okShot)) throw new TypeError(`射データが不正です: ${id}`);
  }
  return ids;
}

// 指定した部員の射だけを置き換える。削除・置換は単一トランザクション。成功は tx.oncomplete でのみ判定する
// 他の部員（非表示部員を含む）のレコードには一切触れない
function saveMemberShots(db, byMember) {
  let ids;
  try { ids = validateByMember(byMember); } catch (e) { return Promise.reject(e); } // トランザクションを開く前に拒否
  const tx = db.transaction('shots', 'readwrite'), st = tx.objectStore('shots'), idx = st.index('byMember'), now = Date.now();
  const p = done(tx);
  let left = ids.length;
  const stale = [];
  for (const mid of ids) {
    const rq = idx.getAll(IDBKeyRange.only(mid));
    rq.onsuccess = () => {
      for (const r of rq.result) if (r.sessionId === SESSION) stale.push(r.id);
      if (--left) return;
      for (const k of stale) st.delete(k); // 先に削除してから…
      for (const m2 of ids) byMember[m2].forEach((r, i) => { // …新しい射を書く
        if (r) st.put({ id: `${SESSION}:${m2}:${i}`, sessionId: SESSION, memberId: m2, shotIndex: i, status: r.status, ...(r.status === 'located' ? { x: r.x, y: r.y } : {}), updatedAt: now });
      });
    };
  }
  return p;
}

// ---- roster.js ----
// 部員データの形・検証・順序（純粋関数。DBやDOMには触れない）
// 部員: { id, number, name, kana, grade, status, hiddenReason, hiddenAt, sortOrder, createdAt, updatedAt }
// number（部員番号）: 登録順に1から振る固定の番号。変更・再利用しない（非表示にしても残る）。古いデータには無いことがある
const STATUS_ACTIVE = 'active', STATUS_HIDDEN = 'hidden';
const HIDDEN_REASONS = ['退部', '卒業', '誤登録', 'その他'];
const NAME_MAX = 40, KANA_MAX = 80;

// 氏名・ふりがな: NFKC正規化、連続空白を1つにして前後を除く
const cleanText = s => String(s == null ? '' : s).normalize('NFKC').replace(/\s+/g, ' ').trim();
// 氏名の同一判定用: 空白をすべて除いて比較
const nameKey = s => cleanText(s).replace(/\s/g, '');
// 学年: 空→null、1/2/3（全角・「1年」可）→数値、それ以外→NaN
function parseGrade(v) {
  const t = cleanText(v);
  if (t === '') return null;
  const m = /^([123])年?$/.exec(t);
  return m ? +m[1] : NaN;
}
const isDangerousLead = s => /^[=+\-@\t\r]/.test(s);

function makeId(cryptoObj = globalThis.crypto) {
  let u;
  if (cryptoObj && cryptoObj.randomUUID) u = cryptoObj.randomUUID();
  else {
    const b = new Uint8Array(16); cryptoObj.getRandomValues(b);
    u = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  return 'm_' + u.replace(/-/g, '');
}

function validateFields({ name, kana, grade }) {
  const errors = [];
  const n = cleanText(name), k = cleanText(kana), g = grade === undefined || grade === null || grade === '' ? null : (typeof grade === 'number' ? (grade >= 1 && grade <= 3 && Number.isInteger(grade) ? grade : NaN) : parseGrade(grade));
  if (!n) errors.push('氏名は必須です');
  if (n.length > NAME_MAX) errors.push(`氏名は${NAME_MAX}文字までです`);
  if (k.length > KANA_MAX) errors.push(`ふりがなは${KANA_MAX}文字までです`);
  if (Number.isNaN(g)) errors.push('学年は 1・2・3 または空欄にしてください');
  return { ok: !errors.length, errors, value: { name: n, kana: k, grade: Number.isNaN(g) ? null : g } };
}

// 部員番号: 1以上の整数
const hasNumber = m => !!m && Number.isInteger(m.number) && m.number >= 1;
const nextNumber = ms => ms.reduce((mx, m) => hasNumber(m) ? Math.max(mx, m.number) : mx, 0) + 1; // 全部員（非表示を含む）の最大値+1

function validateMember(m) {
  if (!m) return { ok: false, errors: ['部員データがありません'] };
  const errors = [];
  if (!m || typeof m.id !== 'string' || !m.id || m.id.includes(':')) errors.push('部員IDが不正です');
  const f = validateFields(m || {}); errors.push(...f.errors);
  if (m.status !== STATUS_ACTIVE && m.status !== STATUS_HIDDEN) errors.push('statusが不正です');
  if (m.status === STATUS_HIDDEN && (!m.hiddenReason || !Number.isFinite(m.hiddenAt))) errors.push('非表示には理由と日時が必要です');
  if (m.status === STATUS_ACTIVE && (m.hiddenReason != null || m.hiddenAt != null)) errors.push('表示中の部員に非表示情報があります');
  if (!Number.isFinite(m.sortOrder)) errors.push('sortOrderが不正です');
  if (m.number !== undefined && !hasNumber(m)) errors.push('部員番号が不正です');
  return { ok: !errors.length, errors };
}

const newMember = (fields, { id, now, sortOrder, number }) => {
  const f = validateFields(fields);
  if (!f.ok) throw new Error(f.errors.join(' / '));
  return { id, ...(number === undefined ? {} : { number }), ...f.value, status: STATUS_ACTIVE, hiddenReason: null, hiddenAt: null, sortOrder, createdAt: now, updatedAt: now };
};
const hideMember = (m, reason, now) => {
  if (!reason) throw new Error('非表示の理由が必要です');
  return { ...m, status: STATUS_HIDDEN, hiddenReason: reason, hiddenAt: now, updatedAt: now };
};
// 再表示すると名簿の末尾に戻る
const showMember = (m, now, sortOrder) => ({ ...m, status: STATUS_ACTIVE, hiddenReason: null, hiddenAt: null, sortOrder, updatedAt: now });

const byOrder = (a, b) => (a.sortOrder - b.sortOrder) || (a.createdAt - b.createdAt) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
const sortActive = ms => ms.filter(m => m.status === STATUS_ACTIVE).sort(byOrder);
const sortHidden = ms => ms.filter(m => m.status === STATUS_HIDDEN).sort((a, b) => (a.hiddenAt - b.hiddenAt) || byOrder(a, b));
const nextSortOrder = ms => ms.reduce((mx, m) => Math.max(mx, m.sortOrder), -1) + 1; // 全部員（非表示を含む）の最大値+1
// 部員構成 = 有効部員のIDの並び。氏名などの編集では変わらない
const configSignature = ms => sortActive(ms).map(m => m.id).join('|');

// ---- roster-store.js ----
// membersストアのCRUD。部員の削除機能はない（非表示のみ）。書き込みはすべて単一トランザクション
const get = (st, id) => new Promise((res, rej) => { const q = st.get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const all = st => new Promise((res, rej) => { const q = st.getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const fail = (tx, msg) => { try { tx.abort(); } catch {} const e = new Error(msg); e.name = 'RosterError'; return e; };

async function listMembers(db) {
  const tx = db.transaction('members'), q = all(tx.objectStore('members')); const p = done(tx);
  const r = await q; await p; return r;
}

// opts: { now, id, allowDuplicate }。同姓同名は allowDuplicate が true のときだけ別人として追加できる
async function addMember(db, fields, opts = {}) {
  const now = opts.now ?? Date.now(), v = validateFields(fields);
  if (!v.ok) throw new Error(v.errors.join(' / '));
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx);
  p.catch(() => {});
  const cur = await all(st);
  if (!opts.allowDuplicate && cur.some(m => nameKey(m.name) === nameKey(v.value.name))) throw fail(tx, '同じ氏名の部員がすでにいます');
  const id = opts.id || makeId();
  if (cur.some(m => m.id === id)) throw fail(tx, '部員IDが重複しました');
  const m = newMember(fields, { id, now, sortOrder: nextSortOrder(cur), number: nextNumber(cur) });
  st.put(m); await p; return m;
}

async function updateMember(db, id, fields, opts = {}) {
  const now = opts.now ?? Date.now(), v = validateFields(fields);
  if (!v.ok) throw new Error(v.errors.join(' / '));
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx); p.catch(() => {});
  const cur = await get(st, id);
  if (!cur) throw fail(tx, '部員が見つかりません');
  const m = { ...cur, ...v.value, updatedAt: now }; // IDは変えない
  st.put(m); await p; return m;
}

async function setHidden(db, id, reason, opts = {}) {
  const now = opts.now ?? Date.now();
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx); p.catch(() => {});
  const cur = await get(st, id);
  if (!cur) throw fail(tx, '部員が見つかりません');
  if (cur.status === 'hidden') throw fail(tx, 'すでに非表示です');
  const m = hideMember(cur, reason, now); st.put(m); await p; return m;
}

async function setShown(db, id, opts = {}) {
  const now = opts.now ?? Date.now();
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx); p.catch(() => {});
  const cur = await get(st, id);
  if (!cur) throw fail(tx, '部員が見つかりません');
  if (cur.status === 'active') throw fail(tx, 'すでに表示中です');
  const m = showMember(cur, now, nextSortOrder(await all(st))); // 名簿の末尾に戻す
  st.put(m); await p; return m;
}

// dir: -1=上へ, +1=下へ。有効部員の順序を 0..n-1 に振り直して入れ替える（単一トランザクション）
async function moveMember(db, id, dir, opts = {}) {
  const now = opts.now ?? Date.now();
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx); p.catch(() => {});
  const act = sortActive(await all(st)), i = act.findIndex(m => m.id === id), j = i + dir;
  if (i < 0) throw fail(tx, '表示中の部員が見つかりません');
  if (j < 0 || j >= act.length) { tx.abort(); return false; }
  [act[i], act[j]] = [act[j], act[i]];
  act.forEach((m, k) => { if (m.sortOrder !== k || m.id === act[i].id || m.id === act[j].id) st.put({ ...m, sortOrder: k, updatedAt: m.sortOrder === k ? m.updatedAt : now }); });
  await p; return true;
}

// CSV取り込みの一括反映。全件を単一トランザクションで適用し、1件でも不正なら全件を戻す
// ops: { adds:[{name,kana,grade}], updates:[{id,name,kana,grade}] }
async function applyImport(db, ops, opts = {}) {
  const now = opts.now ?? Date.now();
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx); p.catch(() => {});
  const cur = await all(st), byId = new Map(cur.map(m => [m.id, m])), seen = new Set();
  const out = [];
  for (const u of ops.updates || []) {
    const old = byId.get(u.id);
    if (!old) throw fail(tx, `存在しない部員IDです: ${u.id}`);
    if (seen.has(u.id)) throw fail(tx, `部員IDが重複しています: ${u.id}`);
    seen.add(u.id);
    const v = validateFields(u); if (!v.ok) throw fail(tx, v.errors.join(' / '));
    out.push({ ...old, ...v.value, updatedAt: now });
  }
  let order = nextSortOrder(cur), num = nextNumber(cur);
  for (const a of ops.adds || []) {
    let id; do { id = makeId(); } while (byId.has(id) || seen.has(id));
    seen.add(id);
    const v = validateFields(a); if (!v.ok) throw fail(tx, v.errors.join(' / '));
    out.push(newMember(a, { id, now, sortOrder: order++, number: num++ }));
  }
  for (const m of out) { const r = validateMember(m); if (!r.ok) throw fail(tx, r.errors.join(' / ')); st.put(m); }
  await p; return { added: (ops.adds || []).length, updated: (ops.updates || []).length };
}

// 部員番号が無い部員（番号機能の追加前に登録した部員）に、登録順（createdAt）で番号を振る。1回で済む処理で、番号のある部員には触れない
// 追加するのは number だけ（氏名・状態・並び順・updatedAt などは変えない）。単一トランザクションで、全員分を反映するか、何も変えないか
async function assignMissingNumbers(db) {
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx); p.catch(() => {});
  const cur = await all(st), missing = cur.filter(m => !hasNumber(m));
  if (!missing.length) { tx.abort(); return 0; }
  let n = nextNumber(cur);
  missing.sort((a, b) => (a.createdAt - b.createdAt) || (a.sortOrder - b.sortOrder) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  for (const m of missing) st.put({ ...m, number: n++ });
  await p; return missing.length;
}

// ---- csv.js ----
// CSVの文字コード判定・解析・取り込み計画・書き出し（純粋関数）
class CsvError extends Error { constructor(code, message) { super(message); this.name = 'CsvError'; this.code = code; } }

const u8 = b => b instanceof Uint8Array ? b : new Uint8Array(b);
// UTF-8 BOMあり→UTF-8（不正ならエラー）／BOMなし→厳密UTF-8、だめならShift_JIS（置換文字が出たらエラー）
function decodeCsv(bytes, TD = globalThis.TextDecoder) {
  const b = u8(bytes);
  if (b.length >= 2 && ((b[0] === 0xFF && b[1] === 0xFE) || (b[0] === 0xFE && b[1] === 0xFF))) throw new CsvError('utf16', 'UTF-16 のファイルには対応していません。UTF-8 または Shift_JIS で保存し直してください');
  const strict = new TD('utf-8', { fatal: true, ignoreBOM: true });
  if (b.length >= 3 && b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) {
    try { return { text: strict.decode(b.subarray(3)), encoding: 'utf-8-bom' }; } catch { throw new CsvError('invalid_utf8', 'BOM付きUTF-8として読めませんでした（文字コードが壊れています）'); }
  }
  try { return { text: strict.decode(b), encoding: 'utf-8' }; } catch {}
  try {
    const t = new TD('shift_jis', { fatal: true }).decode(b);
    if (t.includes('\uFFFD')) throw 0;
    return { text: t, encoding: 'shift_jis' };
  } catch { throw new CsvError('unknown_encoding', '文字コードを判定できませんでした（UTF-8 または Shift_JIS で保存してください）'); }
}

// RFC4180相当。引用符・"" ・CRLF/LF/CR・セル内改行。空行は読み飛ばす
function parseCsv(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], f = '', q = false, i = 0, any = false;
  const endField = () => { row.push(f); f = ''; };
  const endRow = () => { endField(); if (!(row.length === 1 && row[0] === '' && !any)) rows.push(row); row = []; any = false; };
  while (i < text.length) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i += 2; continue; } q = false; i++; continue; }
      f += c; i++; continue;
    }
    if (c === '"' && f === '' ) { q = true; any = true; i++; continue; }
    if (c === '"') throw new CsvError('bad_quote', `引用符の位置が不正です（${rows.length + 1}行目付近）`);
    if (c === ',') { endField(); any = true; i++; continue; }
    if (c === '\r') { endRow(); i += text[i + 1] === '\n' ? 2 : 1; continue; }
    if (c === '\n') { endRow(); i++; continue; }
    f += c; any = true; i++;
  }
  if (q) throw new CsvError('unterminated_quote', '引用符が閉じられていません');
  if (f !== '' || row.length || any) endRow();
  return rows;
}

// 数式インジェクション対策: 書き出し時に先頭へ ' を付け、取り込み時に1つだけ外す
const guardFormula = s => isDangerousLead(s) ? "'" + s : s;
const unguardFormula = s => /^'[=+\-@\t\r]/.test(s) ? s.slice(1) : s;

const HEADERS = { id: '部員ID', name: '氏名', kana: 'ふりがな', grade: '学年' };
// 取り込み計画。kind: new / update / unchanged / dup_name / error。既定の action: new→add、それ以外→skip（updateは明示選択）
function buildPlan(rows, existing) {
  if (!rows.length) throw new CsvError('empty', 'CSVが空です');
  const head = rows[0].map(h => cleanText(unguardFormula(h)));
  const col = {};
  for (const k of Object.keys(HEADERS)) {
    const idx = head.reduce((a, h, i) => h === HEADERS[k] ? a.concat(i) : a, []);
    if (idx.length > 1) throw new CsvError('dup_header', `見出し「${HEADERS[k]}」が重複しています`);
    col[k] = idx.length ? idx[0] : -1;
  }
  if (col.name < 0) throw new CsvError('no_name_header', '見出し行に「氏名」がありません');
  const byId = new Map(existing.map(m => [m.id, m])), idCount = new Map();
  const cell = (r, k) => col[k] < 0 ? '' : unguardFormula(r[col[k]] == null ? '' : r[col[k]]);
  const data = rows.slice(1).map((r, n) => ({ line: n + 2, id: cleanText(cell(r, 'id')), raw: r }));
  for (const d of data) if (d.id) idCount.set(d.id, (idCount.get(d.id) || 0) + 1);
  const exKeys = new Map(); for (const m of existing) exKeys.set(nameKey(m.name), m);
  const newKeys = new Set();
  const out = data.map(d => {
    const base = { line: d.line, id: d.id, messages: [] };
    const f = validateFields({ name: cell(d.raw, 'name'), kana: cell(d.raw, 'kana'), grade: cell(d.raw, 'grade') });
    const wrongGrade = f.errors.some(e => e.startsWith('学年'));
    if (!f.ok) return { ...base, kind: 'error', action: 'none', data: f.value, messages: f.errors };
    const v = f.value;
    if (d.id) {
      if (d.id.includes(':')) return { ...base, kind: 'error', action: 'none', data: v, messages: ['部員IDに使えない文字（:）があります'] };
      if (idCount.get(d.id) > 1) return { ...base, kind: 'error', action: 'none', data: v, messages: ['CSV内で同じ部員IDが重複しています'] };
      const ex = byId.get(d.id);
      if (!ex) return { ...base, kind: 'error', action: 'none', data: v, messages: ['この部員IDは名簿にありません（IDを空にすると新規候補になります）'] };
      const changes = ['name', 'kana', 'grade'].filter(k => (ex[k] ?? (k === 'grade' ? null : '')) !== v[k]).map(k => ({ field: k, from: ex[k] ?? '', to: v[k] ?? '' }));
      return changes.length ? { ...base, kind: 'update', action: 'skip', data: v, existing: ex, changes } : { ...base, kind: 'unchanged', action: 'skip', data: v, existing: ex, changes: [] };
    }
    const key = nameKey(v.name), hit = exKeys.get(key);
    if (hit || newKeys.has(key)) { newKeys.add(key); return { ...base, kind: 'dup_name', action: 'skip', data: v, existing: hit || null, messages: [hit ? (hit.status === 'hidden' ? '同じ氏名の非表示部員がいます' : '同じ氏名の部員がいます') : 'CSV内に同じ氏名の行があります'] }; }
    newKeys.add(key);
    return { ...base, kind: 'new', action: 'add', data: v };
  });
  const counts = out.reduce((a, r) => (a[r.kind] = (a[r.kind] || 0) + 1, a), {});
  return { rows: out, errorCount: counts.error || 0, counts, hasEncodingWarning: false };
}

// choices: Map/obj  line→'add'|'update'|'skip'。エラー行が1つでもあれば取り込めない
function selectOps(plan, choices = {}) {
  if (plan.errorCount) throw new CsvError('has_errors', `エラー行が${plan.errorCount}件あるため取り込めません。CSVを直してもう一度選んでください`);
  const get = r => (choices instanceof Map ? choices.get(r.line) : choices[r.line]) ?? r.action;
  const adds = [], updates = [];
  for (const r of plan.rows) {
    const a = get(r);
    if (a === 'add' && (r.kind === 'new' || r.kind === 'dup_name')) adds.push(r.data);
    else if (a === 'update' && r.kind === 'update') updates.push({ id: r.id, ...r.data });
  }
  return { adds, updates };
}

const q = s => /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
const cellOut = v => q(guardFormula(v == null ? '' : String(v)));
// UTF-8 BOM付き・CRLF（Excelでそのまま開ける）。既定は有効部員のみ
function toCsv(members, { includeHidden = false } = {}) {
  const list = sortActive(members.slice()).concat(includeHidden ? sortHidden(members.slice()) : []);
  const lines = [[HEADERS.id, HEADERS.name, HEADERS.kana, HEADERS.grade].join(',')];
  for (const m of list) lines.push([cellOut(m.id), cellOut(m.name), cellOut(m.kana), cellOut(m.grade)].join(','));
  return '\uFEFF' + lines.join('\r\n') + '\r\n';
}

// ---- practice.js ----
// 練習データの形・検証・再開位置（STEP 2-B1。純粋関数のみ。DBやDOMには触れない）
// 練習メタデータは meta ストアに { key: 'practice:<id>', value } として保存する（ストア・インデックスは追加しない）
// value: { id, mode, memberId, date, startedAt, endedAt, cursor: { round }, rev, updatedAt }
//   mode: 'member_order'（memberId は null）／ 'personal_series'（memberId は対象部員）
//   cursor.round: 現在の立（明示操作「次の立へ」でだけ進む）。rev: 練習の状態を変える操作（立送り・終了・切り替え・再開）で +1
// 旧データ（sessionId 'test-session'）は練習メタデータを持たない仮想的な練習として扱い、一括変換しない
const LEGACY_PRACTICE_ID = 'test-session';
const ACTIVE_KEY = 'activePractice', PRACTICE_PREFIX = 'practice:';
const MODE_MEMBER_ORDER = 'member_order', MODE_PERSONAL_SERIES = 'personal_series';
const PRACTICE_MODES = [MODE_MEMBER_ORDER, MODE_PERSONAL_SERIES];

const isLegacyId = id => id === LEGACY_PRACTICE_ID;
const practiceKey = id => PRACTICE_PREFIX + id;
const isPracticeKey = k => typeof k === 'string' && k.startsWith(PRACTICE_PREFIX);
const validPracticeId = id => typeof id === 'string' && /^p_[0-9A-Za-z_-]+$/.test(id); // ':' を含まない（射のキーの区切りと衝突させない）
// 立番号: 1以上の「安全な整数」（2^53 以上は、隣の整数と区別できず、キーと値の一致を保証できないため不正とする）
const isRound = n => Number.isSafeInteger(n) && n >= 1;
// rev（練習の状態を変える操作で +1 する単調増加カウンタ）: 0以上の「安全な整数」。不正なrevは stale（別の画面での変更）ではなく、練習情報の不整合として扱う
const isRev = n => Number.isSafeInteger(n) && n >= 0;
// rev を +1 して書いても、安全な整数のままか（上限に達していたら、書き込まずに拒否する）
const canBumpRev = n => isRev(n) && Number.isSafeInteger(n + 1);

function makePracticeId(cryptoObj = globalThis.crypto) {
  let u;
  if (cryptoObj && cryptoObj.randomUUID) u = cryptoObj.randomUUID();
  else { const b = new Uint8Array(16); cryptoObj.getRandomValues(b); u = [...b].map(x => x.toString(16).padStart(2, '0')).join(''); }
  return 'p_' + u.replace(/-/g, '');
}
// 端末のローカル日付 YYYY-MM-DD（toISOString は使わない）
const localDate = (d = new Date()) => { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };

// 射のキー。旧データは STEP 1/2-A と同じ `${sessionId}:${memberId}:${shotIndex}`（立を持たない）。
// 新しい練習は `${practiceId}:${memberId}:${round}:${shotIndex}`（shotIndex は旧データと同じ 0〜3）
const shotKey = (practiceId, memberId, round, shotIndex) => isLegacyId(practiceId) ? `${practiceId}:${memberId}:${shotIndex}` : `${practiceId}:${memberId}:${round}:${shotIndex}`;
// 「その練習の射」「その練習・部員・立のカード」を、キーの前方一致で範囲指定するための境界（':' の次の文字 ';' までが前方一致）
const prefixBounds = prefix => [prefix + ':', prefix + ';'];
const practiceBounds = practiceId => prefixBounds(practiceId);
const cardBounds = (practiceId, memberId, round) => prefixBounds(`${practiceId}:${memberId}:${round}`);

function newPractice({ id, mode, memberId, now }) {
  if (!validPracticeId(id)) throw new TypeError(`練習IDが不正です: ${id}`);
  if (!PRACTICE_MODES.includes(mode)) throw new TypeError(`記録モードが不正です: ${mode}`);
  if (mode === MODE_PERSONAL_SERIES) { if (typeof memberId !== 'string' || !memberId || memberId.includes(':')) throw new TypeError('個人連続記録には対象部員のIDが必要です'); }
  else if (memberId != null) throw new TypeError('部員順記録では部員IDを指定しません');
  if (!Number.isFinite(now)) throw new TypeError('時刻が不正です');
  return { id, mode, memberId: mode === MODE_PERSONAL_SERIES ? memberId : null, date: localDate(new Date(now)), startedAt: now, endedAt: null, cursor: { round: 1 }, rev: 0, updatedAt: now };
}

// 保存された練習レコードの値が、練習として読める形か（id・記録モード・rev）
const practiceShapeOk = (p, id) => !!p && typeof p === 'object' && p.id === id && PRACTICE_MODES.includes(p.mode) && isRev(p.rev);
const cursorOf = p => p && p.cursor && typeof p.cursor === 'object' ? p.cursor.round : undefined;

// 対象練習の射のうち、有効な立（1以上の整数）の最大値。射が無ければ 0
function maxRoundOf(shots, practiceId) {
  let max = 0;
  for (const r of shots) if (r && r.sessionId === practiceId && isRound(r.round) && r.round > max) max = r.round;
  return max;
}
// ---- R7 の検査（O2）: 新しい練習に属する射記録を厳格に検査する。不正な射を「最大の立の計算から除外」せず、不整合として安全停止する ----
// 新しい練習だけが対象。旧データ（test-session）は従来形式のまま、この検査を受けない。練習ごとに独立して検査する
// 「その練習に属する射」= sessionId が練習IDと一致する射、または射のID（主キー）が `${練習ID}:` で始まる射
//   （どちらか一方だけで探すと、IDとsessionIdの食い違いを見逃す。`p_a` と `p_ab` は、':' を含めた前方一致で区別する）
const belongsTo = (r, practiceId) => !!r && typeof r === 'object' && (r.sessionId === practiceId || (typeof r.id === 'string' && r.id.startsWith(practiceId + ':')));
// 不整合の種類は shot_invalid に集約し、detail の reason で区別する（コードを増やしすぎない）
//   round_invalid: roundが1以上の整数でない ／ shot_index_invalid: shotIndexが0〜3の整数でない ／ session_mismatch: sessionIdが練習IDと異なる
//   shot_duplicate: 同一練習・同一部員・同一立・同一射番号の重複 ／ shot_key_mismatch: ID（主キー）が各フィールドから作られる正規のキーと一致しない（立・部員・射番号の食い違い、部員IDが不正な場合を含む）
function inspectShots(practiceId, rows) {
  const seen = new Set();
  for (const r of rows) {
    if (!belongsTo(r, practiceId)) continue;
    const bad = reason => ({ code: 'shot_invalid', reason, shotId: r.id });
    if (!isRound(r.round)) return bad('round_invalid');
    if (!Number.isInteger(r.shotIndex) || r.shotIndex < 0 || r.shotIndex >= SHOTS) return bad('shot_index_invalid');
    if (r.sessionId !== practiceId) return bad('session_mismatch');
    if (typeof r.memberId !== 'string' || !r.memberId || r.memberId.includes(':')) return bad('shot_key_mismatch'); // 正規のキーを作れない部員ID
    const logical = `${r.memberId}\u0000${r.round}\u0000${r.shotIndex}`;
    if (seen.has(logical)) return bad('shot_duplicate'); seen.add(logical);
    if (r.id !== shotKey(practiceId, r.memberId, r.round, r.shotIndex)) return bad('shot_key_mismatch');
  }
  return null;
}
// 練習1つの整合性検査（rows は、その練習に属する射を含む配列）。順序: cursorの形(B) → 射記録の形(O2) → cursorと最大の立(A)
function inspectPractice(practice, rows) {
  const behind = checkProgress(practice, maxRoundOf(rows, practice.id));
  if (behind && behind.code === 'cursor_invalid') return behind;
  return inspectShots(practice.id, rows) || behind;
}

// 不整合の検出（新しい練習だけが対象。旧データはcursorを持たないため対象外）
//   A: cursor.round < 対象練習の射の最大立  B: cursor.round が1以上の整数ではない
// 次は不整合としない: cursorが最大立と同じ／最大立より大きい／立番号の欠番
function checkProgress(practice, maxRound) {
  const c = cursorOf(practice);
  if (!isRound(c)) return { code: 'cursor_invalid', cursor: c, maxRound };
  if (c < maxRound) return { code: 'cursor_behind', cursor: c, maxRound };
  return null;
}
const heldOf = p => ({ practiceId: p.id, cursorRound: p.cursor.round, rev: p.rev });

// 再開位置（cursor.round を基準にする。未入力の射を補完せず、位置不明の外れは記録済みとして扱う）
//   record: その立の最初の空き射から再開 ／ round_complete: 4射とも記録済み。完了状態で待機（自動で次の立へ進まない）
function resumePosition(practice, shots) {
  const round = cursorOf(practice);
  if (practice.mode !== MODE_PERSONAL_SERIES) return { kind: 'member_order', round };
  const filled = new Set();
  for (const r of shots) if (r && r.sessionId === practice.id && r.memberId === practice.memberId && r.round === round && Number.isInteger(r.shotIndex) && r.shotIndex >= 0 && r.shotIndex < SHOTS) filled.add(r.shotIndex);
  for (let i = 0; i < SHOTS; i++) if (!filled.has(i)) return { kind: 'record', round, shotIndex: i, recorded: filled.size };
  return { kind: 'round_complete', round, shotIndex: null, recorded: filled.size };
}

// 保存・立送りなどを拒否したときのエラー。lock: 画面を停止すべき種類（'stale'＝別の画面で状態が変わった／'inconsistent'＝進行情報と記録が不一致）
class PracticeError extends Error {
  constructor(code, lock, message, detail) { super(message); this.name = 'PracticeError'; this.code = code; this.lock = lock; this.detail = detail || {}; }
}

// ---- practice-db.js ----
// 練習データのDB層（STEP 2-B1）。DB接続は保持しない（app.js が管理し、引数で受け取る）。ストア・インデックスは追加しない。
// すべての検証と書き込みを1つの readwrite トランザクションにまとめ、トランザクション中に await を挟まない（リクエストのコールバックでつなぐ）。
// 拒否・失敗時はトランザクションを abort し、shots・meta には何も書かない。

// body(t) の中で t.get / t.all でリクエストをつなぎ、t.finish(値) で結果を渡す。t.fail(エラー) で abort して reject する
function pdbRun(db, stores, mode, body) {
  return new Promise((resolve, reject) => {
    let tx, failure = null, result;
    try { tx = db.transaction(stores, mode); } catch (e) { reject(e); return; }
    const fail = e => { if (!failure) failure = e; try { tx.abort(); } catch {} };
    const guard = f => v => { try { f(v); } catch (e) { fail(e); } };
    const t = {
      tx, fail, finish: v => { result = v; },
      get: (store, key, f) => { const r = tx.objectStore(store).get(key); r.onsuccess = guard(() => f(r.result)); },
      every: (store, f) => { const r = tx.objectStore(store).getAll(); r.onsuccess = guard(() => f(r.result)); },
      all: (store, bounds, f) => { const r = tx.objectStore(store).getAll(IDBKeyRange.bound(bounds[0], bounds[1], false, true)); r.onsuccess = guard(() => f(r.result)); },
    };
    tx.oncomplete = () => failure ? reject(failure) : resolve(result);
    tx.onabort = () => reject(failure || tx.error || new Error('トランザクションが中止されました'));
    try { body(t); } catch (e) { fail(e); }
  });
}
const stale = (code, msg, detail) => new PracticeError(code, 'stale', msg, detail);
const inconsistent = (code, msg, detail) => new PracticeError(code, 'inconsistent', msg, detail);
// 上限到達（立・rev）: データは不正ではなく、読み込みも保存も終了もできる。次の立へ進む／revを更新する操作だけを拒否し、アプリ全体はロックしない（lock なし）
const exhausted = (code, msg, detail) => new PracticeError(code, null, msg, detail);
const progressError = bad => inconsistent(bad.code,
  bad.code === 'cursor_behind' ? `練習の進行情報（現在の立: ${bad.cursor}）と記録（最大の立: ${bad.maxRound}）が一致しません`
    : bad.code === 'shot_invalid' ? `練習の射の記録が正しくありません（${bad.reason}: ${bad.shotId}）` : '練習の進行情報（現在の立）が正しい値ではありません',
  bad.code === 'shot_invalid' ? { reason: bad.reason, shotId: bad.shotId } : { cursor: bad.cursor, maxRound: bad.maxRound });
const isHeld = h => !!h && typeof h.practiceId === 'string' && !!h.practiceId && isRound(h.cursorRound) && isRev(h.rev);
// activePractice のID: 旧データ（test-session）か、新しい練習IDの形式（validPracticeId）だけが正しい。それ以外は練習レコードを探さず、旧データにも落とさず、安全停止する
const activeIdOk = id => isLegacyId(id) || validPracticeId(id);
const activeInvalid = () => inconsistent('active_invalid', '現在の練習の情報を正しく読み取れません');
// rev を +1 できない（安全な整数の上限）: 書き込まずに、その操作だけを拒否する（ロックしない）。revが不正な場合は practiceShapeOk が先に practice_invalid で拒否する
const revExhausted = rev => exhausted('rev_exhausted', '練習の更新回数が上限に達しているため、これ以上更新できません', { rev });

// 練習の整合性検査の入口（検証と射の読み取りをここに集約）。cursor と射記録の矛盾を返す（問題なければ null）
const pdbInspect = inspectPractice;
// 対象練習の射の取得。full=true: 全射記録を走査し、その練習に属する射（sessionIdが一致、またはIDが前方一致）を返す（インデックスを追加せずに、
//   「sessionIdは対象練習だがIDが別形式」の射を見つけるため）。すべての入口（読み込み・開始・切り替え・立送り・終了・射保存）がこれを使う
//   full=false: IDの前方一致の範囲だけ。現在は使われていない（範囲外の不整合を見逃すため、安全性を要する検査には使わない）
const pdbShotRows = (t, pid, full, cb) => full ? t.every('shots', rows => cb(rows.filter(r => belongsTo(r, pid)))) : t.all('shots', practiceBounds(pid), cb);

// expected: 呼び出し元（画面）が認識している、現在のactive状態。DB上の状態と同一トランザクション内で照合する
//   null＝activePracticeなし ／ { practiceId: 'test-session' }＝旧データ ／ { practiceId, cursorRound, rev }＝新しい練習
// 省略（undefined）は許さない（「確認しない」を既定にしない）
function pdbExpected(e) {
  if (e === null) return e;
  if (e && typeof e === 'object' && isLegacyId(e.practiceId)) return e;
  if (isHeld(e)) return e;
  throw new TypeError("expected（画面が認識している現在のactive状態）が必要です: null／{ practiceId: 'test-session' }／{ practiceId, cursorRound, rev }");
}
// 同一トランザクション内で activePractice を読み、expected と照合する。cont() は、照合と（新しい練習がactiveなら）整合性検査に通ったときだけ呼ばれる
//   不一致 → stale ／ activeな新しい練習の不整合 → inconsistent ／ どちらも何も書かずにabort
function pdbCheckActive(t, expected, cont) {
  t.get('meta', ACTIVE_KEY, act => {
    const aid = act && act.value && act.value.id;
    if (act && !activeIdOk(aid)) return t.fail(activeInvalid());
    if (expected === null) { if (act) return t.fail(stale('practice_changed', '別の練習が開始されています', { active: aid })); return cont(); }
    if (isLegacyId(expected.practiceId)) { if (aid !== LEGACY_PRACTICE_ID) return t.fail(stale('practice_changed', '別の練習に切り替わっています', { active: aid })); return cont(); }
    if (aid !== expected.practiceId) return t.fail(stale('practice_changed', '別の練習に切り替わっています', { active: aid }));
    t.get('meta', practiceKey(aid), rec => {
      const p = rec && rec.value, bad = pdbVerifyHeld(p, expected);
      if (bad) return t.fail(bad);
      pdbShotRows(t, aid, true, rows => { const nc = pdbInspect(p, rows); if (nc) return t.fail(progressError(nc)); cont(); });
    });
  });
}

// 画面が保持する状態 held = { practiceId, cursorRound, rev } とDBの状態を照合する（shots を読む前に分かる分）
// 戻り値: 拒否するときは PracticeError、問題なければ null。順序: 練習の形 → cursorの形(B) → cursor一致 → rev一致
function pdbVerifyHeld(p, held) {
  if (!practiceShapeOk(p, held.practiceId)) return inconsistent('practice_invalid', '練習情報を正しく読み取れません');
  const c = cursorOf(p);
  if (!isRound(c)) return progressError({ code: 'cursor_invalid', cursor: c, maxRound: 0 });
  if (c !== held.cursorRound) return stale('cursor_changed', '現在の立が別の画面で変更されています', { cursor: c, held: held.cursorRound });
  if (p.rev !== held.rev) return stale('rev_changed', '練習の状態が別の画面で変更されています', { rev: p.rev, held: held.rev });
  return null;
}

// 起動時などの読み込み（読み取り専用）。練習レコードと対象練習の射を同一トランザクションで読み、不整合を検出する
// kind: none（activePractice なし）／ legacy（旧データ）／ ok（新しい練習。resume 付き）／ inconsistent（安全停止すべき状態）
function loadPracticeState(db) {
  return pdbRun(db, ['meta', 'shots'], 'readonly', t => {
    t.get('meta', ACTIVE_KEY, act => {
      if (!act) return t.finish({ kind: 'none' });
      const id = act.value && act.value.id;
      if (id === LEGACY_PRACTICE_ID) return t.finish({ kind: 'legacy' });
      if (!validPracticeId(id)) return t.finish({ kind: 'inconsistent', code: 'active_invalid' }); // 新しい練習IDの形式でなければ、練習レコードを探さずに停止
      t.get('meta', practiceKey(id), rec => {
        const p = rec && rec.value;
        if (!practiceShapeOk(p, id)) return t.finish({ kind: 'inconsistent', code: 'practice_invalid', practiceId: id });
        pdbShotRows(t, id, true, rows => {
          const bad = pdbInspect(p, rows);
          if (bad) return t.finish({ kind: 'inconsistent', practiceId: id, ...bad });
          t.finish({ kind: 'ok', practice: p, maxRound: maxRoundOf(rows, id), resume: resumePosition(p, rows) });
        });
      });
    });
  });
}

// ---- 射の保存（旧データを含む、唯一の保存入口） ----
// ctx: 旧データ { practiceId: 'test-session' } ／ 新しい練習 { practiceId, round, cursorRound, rev }
// byMember: { 部員ID: [4スロット（null=未入力）] }。保存対象のカード（部員×立）の既存の射を削除し、記録済みのスロットだけを書き込む
// opts.now: 時刻（テスト用）
function saveShots(db, ctx, byMember, opts = {}) {
  let ids;
  try { ids = validateByMember(byMember); } catch (e) { return Promise.reject(e); } // トランザクションを開く前に拒否
  const pid = ctx && ctx.practiceId, legacy = isLegacyId(pid), now = opts.now ?? Date.now();
  if (typeof pid !== 'string' || !pid) return Promise.reject(new TypeError('練習IDがありません'));
  if (!legacy && !(isRound(ctx.round) && isHeld({ practiceId: pid, cursorRound: ctx.cursorRound, rev: ctx.rev }))) return Promise.reject(new TypeError('練習の保存には、立・現在の立・rev が必要です'));
  return pdbRun(db, ['shots', 'meta'], 'readwrite', t => {
    const st = t.tx.objectStore('shots');
    t.get('meta', ACTIVE_KEY, act => {
      const activeId = act && act.value && act.value.id;
      if (act && !activeIdOk(activeId)) return t.fail(activeInvalid());
      if (legacy) { // 旧データ: activePractice が未設定、または test-session のときだけ保存できる（新しい練習へ切り替わっていたら拒否）
        if (act && activeId !== LEGACY_PRACTICE_ID) return t.fail(stale('practice_changed', '別の練習に切り替わっています', { active: activeId }));
        const idx = st.index('byMember'), stales = []; let left = ids.length;
        for (const mid of ids) {
          const rq = idx.getAll(IDBKeyRange.only(mid));
          rq.onsuccess = () => {
            for (const r of rq.result) if (r.sessionId === SESSION) stales.push(r.id);
            if (--left) return;
            for (const k of stales) st.delete(k); // 先に削除してから…
            for (const m2 of ids) byMember[m2].forEach((r, i) => { // …新しい射を書く（旧データの形式は変えない）
              if (r) st.put({ id: shotKey(SESSION, m2, 1, i), sessionId: SESSION, memberId: m2, shotIndex: i, status: r.status, ...(r.status === 'located' ? { x: r.x, y: r.y } : {}), updatedAt: now });
            });
            t.finish({ practiceId: pid });
          };
        }
        return;
      }
      if (!act || activeId !== pid) return t.fail(stale('practice_changed', '別の練習に切り替わっています', { active: activeId }));
      t.get('meta', practiceKey(pid), rec => {
        const p = rec && rec.value, held = { practiceId: pid, cursorRound: ctx.cursorRound, rev: ctx.rev }, bad = pdbVerifyHeld(p, held);
        if (bad) return t.fail(bad);
        pdbShotRows(t, pid, true, rows => { // 射保存も全件走査で検査する（sessionIdは対象練習だがIDが別形式の射を見逃さない。検査対象を減らして整合性を弱めない）
          const nc = pdbInspect(p, rows); // 保存開始時点で進行情報と記録が不一致なら、何も書かずに拒否
          if (nc) return t.fail(progressError(nc));
          if (ctx.round > p.cursor.round) return t.fail(stale('round_out_of_range', '保存先の立が現在の立より先です', { round: ctx.round, cursor: p.cursor.round }));
          for (const mid of ids) {
            const [lo, hi] = cardBounds(pid, mid, ctx.round);
            st.delete(IDBKeyRange.bound(lo, hi, false, true)); // 対象カードの既存の射を削除（他の部員・他の立には触れない）
            byMember[mid].forEach((r, i) => {
              if (r) st.put({ id: shotKey(pid, mid, ctx.round, i), sessionId: pid, memberId: mid, round: ctx.round, shotIndex: i, status: r.status, ...(r.status === 'located' ? { x: r.x, y: r.y } : {}), updatedAt: now });
            });
          }
          t.finish({ practiceId: pid });
        });
      });
    });
  });
}

// ---- 練習の開始・切り替え・終了・立送り（データ層のみ。新しい練習を開くUIはSTEP 2-B1には含めない） ----
// 開始: activePractice の照合（expected）・activeな新しい練習の整合性検査・練習レコードと activePractice の書き込みを、すべて同一トランザクションで行う
// （片方だけが書かれる状態・別タブとの同時開始で両方成功する状態を作らない）
function startPractice(db, { mode, memberId = null, id, now, expected } = {}) {
  let p, ex;
  try { ex = pdbExpected(expected); p = newPractice({ id: id || makePracticeId(), mode, memberId, now: now ?? Date.now() }); } catch (e) { return Promise.reject(e); }
  return pdbRun(db, ['meta', 'shots'], 'readwrite', t => {
    pdbCheckActive(t, ex, () => { // activePractice を読んで expected と照合し、activeな新しい練習があれば整合性も検査してから、同じトランザクション内で書く
      t.get('meta', practiceKey(p.id), exist => {
        if (exist) return t.fail(new PracticeError('practice_exists', null, '同じIDの練習がすでにあります'));
        t.tx.objectStore('meta').put({ key: practiceKey(p.id), value: p });
        t.tx.objectStore('meta').put({ key: ACTIVE_KEY, value: { id: p.id } });
        t.finish(heldOf(p));
      });
    });
  });
}

// 切り替え・再開: 切り替え元（activePractice と expected の照合・整合性）と切り替え先の整合性を同一トランザクション内で検証し（どちらかが不整合なら何も書かない）、activePractice の更新と対象練習の rev +1 を同一トランザクションで行う
// endedAt には触れない（再開時の扱いは未定義のため、STEP 2-B1では変更しない）。旧データ（test-session）へは切り替えない
function switchPractice(db, targetId, opts = {}) {
  let ex;
  try { if (!validPracticeId(targetId)) throw new TypeError(`練習IDが不正です: ${targetId}`); ex = pdbExpected(opts.expected); } catch (e) { return Promise.reject(e); }
  const now = opts.now ?? Date.now();
  return pdbRun(db, ['meta', 'shots'], 'readwrite', t => {
    pdbCheckActive(t, ex, () => { // 切り替え元: activePractice と expected の照合・整合性検査（新しい練習がactiveの場合）
      t.get('meta', practiceKey(targetId), rec => { // 切り替え先: 練習レコードと射記録の整合性検査
        const p = rec && rec.value;
        if (!rec) return t.fail(new PracticeError('practice_missing', null, '練習が見つかりません'));
        if (!practiceShapeOk(p, targetId)) return t.fail(inconsistent('practice_invalid', '練習情報を正しく読み取れません'));
        pdbShotRows(t, targetId, true, rows => {
          const bad = pdbInspect(p, rows);
          if (bad) return t.fail(progressError(bad));
          if (!canBumpRev(p.rev)) return t.fail(revExhausted(p.rev)); // revの形は practiceShapeOk が検査済み。ここは +1 が安全な整数のままかだけを見る
          const np = { ...p, rev: p.rev + 1, updatedAt: now };
          t.tx.objectStore('meta').put({ key: practiceKey(targetId), value: np });
          t.tx.objectStore('meta').put({ key: ACTIVE_KEY, value: { id: targetId } });
          t.finish(heldOf(np));
        });
      });
    });
  });
}

// held（画面が保持する状態）が、DBの activePractice・cursor・rev と一致し、進行情報と記録が整合していることを、同一トランザクション内で確認してから fn を実行する
function pdbGuarded(db, held, fn) {
  if (!isHeld(held)) return Promise.reject(new TypeError('画面の練習状態（練習ID・現在の立・rev）が不正です'));
  return pdbRun(db, ['meta', 'shots'], 'readwrite', t => {
    t.get('meta', ACTIVE_KEY, act => {
      const activeId = act && act.value && act.value.id;
      if (act && !activeIdOk(activeId)) return t.fail(activeInvalid());
      if (!act || activeId !== held.practiceId) return t.fail(stale('practice_changed', '別の練習に切り替わっています', { active: activeId }));
      t.get('meta', practiceKey(held.practiceId), rec => {
        const p = rec && rec.value, bad = pdbVerifyHeld(p, held);
        if (bad) return t.fail(bad);
        pdbShotRows(t, held.practiceId, true, rows => {
          const nc = pdbInspect(p, rows);
          if (nc) return t.fail(progressError(nc));
          fn(t, p, rows);
        });
      });
    });
  });
}

// 「次の立へ」: 現在の立に記録済みの射が1つ以上あるときだけ、cursor.round +1・rev +1・updatedAt を更新する
// 成功したときだけ新しい held を返す（失敗時は reject。呼び出し側は画面を進めない）。1〜3射のときの確認は画面側の責務
function advanceRound(db, held, opts = {}) {
  const now = opts.now ?? Date.now();
  return pdbGuarded(db, held, (t, p, rows) => {
    if (!canBumpRev(p.rev)) return t.fail(revExhausted(p.rev));
    if (!isRound(p.cursor.round + 1)) return t.fail(exhausted('round_exhausted', '立の番号が上限に達しているため、次の立へは進めません', { round: p.cursor.round })); // 不正なcursorを書いてから次の読み込みで検出するのではなく、書き込む前に拒否する
    const n = rows.filter(r => r && r.sessionId === p.id && r.round === p.cursor.round && Number.isInteger(r.shotIndex)).length;
    if (n < 1) return t.fail(stale('round_empty', '現在の立に記録済みの射がないため、次の立へは進めません', { round: p.cursor.round }));
    const np = { ...p, cursor: { ...p.cursor, round: p.cursor.round + 1 }, rev: p.rev + 1, updatedAt: now };
    t.tx.objectStore('meta').put({ key: practiceKey(p.id), value: np });
    t.finish(heldOf(np));
  });
}

// 終了: endedAt の設定・rev +1・activePractice の解除を同一トランザクションで行う。練習レコードは削除しない
function endPractice(db, held, opts = {}) {
  const now = opts.now ?? Date.now();
  return pdbGuarded(db, held, (t, p) => {
    if (!canBumpRev(p.rev)) return t.fail(revExhausted(p.rev));
    t.tx.objectStore('meta').put({ key: practiceKey(p.id), value: { ...p, endedAt: now, rev: p.rev + 1, updatedAt: now } });
    t.tx.objectStore('meta').delete(ACTIVE_KEY);
    t.finish({ practiceId: p.id, endedAt: now, rev: p.rev + 1 });
  });
}

// ---- shot-csv.js ----
// 射記録CSV（純粋関数。DBやDOMには触れない）。部員CSV（csv.js）とは別の処理で、guardFormula は使わない
// 列: ID（部員番号）, member_name, STATUS, 射, 結果（◯＝的中／×＝外れ・位置不明）, 的中率（N射M中。Nは記録済みの射数）, x, y（右端。位置不明は空欄）
// ID は部員番号（登録順に振った固定の番号）。番号がない部員・部員情報がない射は、部員IDで出す（落とさない）
const SHOT_CSV_HEADERS = ['ID', 'member_name', 'STATUS', '射', '結果', '的中率', 'x', 'y'];
// STEP 2-B1: 既存8列の右端に練習情報の4列を追加する（既存8列の列名・順序・意味・値は変えない）
//   practice_id: 練習ID（旧データは test-session）／ practice_date: 練習開始時の端末ローカル日付 YYYY-MM-DD（旧データ・練習情報のない射は空欄）
//   recording_mode: member_order / personal_series（旧データは member_order。練習情報のない射は空欄）／ round: 立番号（旧データは 1。練習情報のない射は、射に立があればその値、なければ空欄）
const SHOT_CSV_PRACTICE_HEADERS = ['practice_id', 'practice_date', 'recording_mode', 'round'];
const SHOT_CSV_ALL_HEADERS = [...SHOT_CSV_HEADERS, ...SHOT_CSV_PRACTICE_HEADERS];
const MARK_HIT = '◯', MARK_MISS = '×';
class ShotCsvError extends Error { constructor(code, msg) { super(msg); this.name = 'ShotCsvError'; this.code = code; } }

// 文字列列（ID・氏名・STATUS）: 先頭が = + - @ タブ CR のとき ' を付け、カンマ・引用符・改行を含むときは "..." で囲む
const textCell = s => { const t = String(s == null ? '' : s), g = isDangerousLead(t) ? "'" + t : t; return /[",\r\n]/.test(g) ? '"' + g.replace(/"/g, '""') + '"' : g; };

// 数値列（x, y）: 保存値をそのまま文字にする。数式対策・丸め・符号変更はしない（-0 も符号を残す）
const numCell = v => Object.is(v, -0) ? '-0' : String(v);

// 端末のローカル日付（toISOString は使わない）
const shotCsvFileName = (d = new Date()) => { const p = n => String(n).padStart(2, '0'); return `射記録_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.csv`; };

// 練習メタデータ（meta ストアの { key: 'practice:<id>', value } の行）を検証し、値の配列にして返す（F-6）。
// 壊れたメタデータを取得対象から除外すると、その練習の射が「練習情報のない射」として黙って出力されてしまう。除外せず、CSV出力を拒否する。
//   検査: キーが 'practice:' で始まる ／ キーのID が新しい練習IDの形式（旧データ test-session はメタデータを持たない） ／ 値がobject ／ 値の id がキーのIDと一致 ／ 記録モード・rev が正しい ／ date が実在する日付 ／ startedAt が有限の数値（CSVの練習順序の基準のため）
// 読み取り専用の検査のみ。DBには触れず、アプリ全体のロックもしない（CSV出力の拒否だけ）
const shortKey = k => { const t = String(k); return t.length > 40 ? t.slice(0, 40) + '…' : t; };
// 実在する日付か（YYYY-MM-DD の形式 ＋ 暦として存在する。2026-99-99・2026-02-30・平年の2月29日は不可）
const isRealDate = s => {
  if (typeof s !== 'string' || !DATE_RE.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number), t = new Date(Date.UTC(y, m - 1, d)); t.setUTCFullYear(y);
  return y >= 1 && t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
};
function practiceValuesFromMeta(rows) {
  const bad = (code, msg) => new ShotCsvError(code, msg);
  return (rows || []).map(row => {
    const key = row && typeof row === 'object' ? row.key : undefined;
    if (typeof key !== 'string' || !key.startsWith(PRACTICE_PREFIX)) throw bad('bad_practice', '練習情報のキーが正しくありません');
    const id = key.slice(PRACTICE_PREFIX.length), v = row.value;
    if (!validPracticeId(id)) throw bad('bad_practice', `練習情報のIDが正しくありません（${shortKey(key)}）`);
    if (!v || typeof v !== 'object' || Array.isArray(v)) throw bad('bad_practice', `練習情報の値が正しくありません（${shortKey(key)}）`);
    if (v.id !== id) throw bad('bad_practice', `練習情報のキーと値のIDが一致しません（${shortKey(key)}）`);
    if (!practiceShapeOk(v, id)) throw bad('bad_practice', `練習情報の必須項目（記録モード・rev）が正しくありません（${shortKey(key)}）`);
    if (!isRealDate(v.date)) throw bad('bad_practice', `練習情報の日付が正しくありません（${shortKey(key)}）`);
    if (typeof v.startedAt !== 'number' || !Number.isFinite(v.startedAt)) throw bad('bad_practice', `練習情報の開始日時が正しくありません（${shortKey(key)}）`);
    return v;
  });
}

const UNKNOWN = { name: '', status: 'unknown' }; // 対応する部員がいない射（通常は発生しない）。落とさずに出す

function checkShot(r) {
  if (!r || typeof r !== 'object') throw new ShotCsvError('bad_record', '射記録の形が不正です');
  if (typeof r.memberId !== 'string' || !r.memberId) throw new ShotCsvError('bad_record', '射記録に部員IDがありません');
  if (!Number.isInteger(r.shotIndex) || r.shotIndex < 0 || r.shotIndex > 3) throw new ShotCsvError('bad_record', `射番号が不正です（${r.memberId}）`);
  if (r.status === 'located') { if (!Number.isFinite(r.x) || !Number.isFinite(r.y)) throw new ShotCsvError('bad_record', `座標が数値ではありません（${r.memberId} の${r.shotIndex + 1}射目）`); }
  else if (r.status !== 'unlocated_miss') throw new ShotCsvError('bad_record', `状態が不正です（${r.memberId} の${r.shotIndex + 1}射目）`);
}

// shots: DBの射レコード（保存済みのものだけ。すべての練習）。members: DBの全部員（非表示を含む）。practices: 練習メタデータの値（省略可）
// 戻り値: { csv, count }。出力する射が0件のときは ShotCsvError('empty') を投げる（空のCSVを成功扱いにしない）
// 並び順: 練習（旧データ → 開始日時の古い順 → 練習情報のない射）→ 立 → 部員（名簿順）→ 射番号
// 的中率: 同一練習・同一立・同一部員の、記録済みの射だけを数える（別の練習・別の立は合算しない）
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function buildShotCsv(shots, members, practices = []) {
  if (!Array.isArray(shots) || !shots.length) throw new ShotCsvError('empty', '出力できる保存済み射記録がありません');
  for (const r of shots) checkShot(r);
  const byId = new Map(members.map(m => [m.id, m]));
  // 値だけを渡された場合の防御（F-6）: object でない値・不正な練習IDを、黙って無視して孤立データ扱いにしない（モード・日付などの細部は、従来どおり出力側で空欄にする）
  for (const p of practices || []) if (!p || typeof p !== 'object' || Array.isArray(p) || !validPracticeId(p.id)) throw new ShotCsvError('bad_practice', '練習情報が正しくありません');
  const pById = new Map((practices || []).map(p => [p.id, p]));
  // 練習情報のある射は、R7（practice.js の inspectShots）と同じ基準で検査する。不正な射を黙って出力しない（旧データ・孤立した射は対象外）
  //   1回の走査で、sessionId または ID の前方一致が練習に一致する射を、練習ごとに振り分ける
  const owned = new Map();
  for (const r of shots) for (const o of new Set([r.sessionId, typeof r.id === 'string' && r.id.includes(':') ? r.id.slice(0, r.id.indexOf(':')) : null])) if (pById.has(o)) { if (!owned.has(o)) owned.set(o, []); owned.get(o).push(r); }
  for (const [pid, rs] of owned) { const bad = inspectShots(pid, rs); if (bad) throw new ShotCsvError('bad_record', `練習の射の記録が正しくありません（${bad.reason}）`); }
  // 部員の並び: 有効部員（名簿順）→ 非表示部員 → 対応する部員がいないID。各部員の中は射番号順
  const order = new Map(); let k = 0;
  for (const m of sortActive(members.slice()).concat(sortHidden(members.slice()))) order.set(m.id, k++);
  const orphans = [...new Set(shots.map(r => r.memberId).filter(id => !byId.has(id)))].sort();
  for (const id of orphans) order.set(id, k++);
  // 各射の練習情報。旧データは固定値、練習情報のある射は立が必須、練習情報のない射（孤立した射）は落とさずに出す
  const info = r => {
    const sid = typeof r.sessionId === 'string' ? r.sessionId : '';
    if (sid === LEGACY_PRACTICE_ID) return { g: 0, sid, start: 0, date: '', mode: MODE_MEMBER_ORDER, round: 1 };
    const p = pById.get(sid);
    if (p) {
      if (!isRound(r.round)) throw new ShotCsvError('bad_record', `立番号が不正です（${r.memberId} の${r.shotIndex + 1}射目）`);
      return { g: 1, sid, start: Number.isFinite(p.startedAt) ? p.startedAt : Infinity, date: DATE_RE.test(p.date) ? p.date : '', mode: PRACTICE_MODES.includes(p.mode) ? p.mode : '', round: r.round };
    }
    return { g: 2, sid, start: 0, date: '', mode: '', round: isRound(r.round) ? r.round : '' };
  };
  const rows = shots.map(r => ({ r, i: info(r) }));
  const cmp = (a, b) => (a.i.g - b.i.g) || (a.i.start - b.i.start || 0) || (a.i.sid < b.i.sid ? -1 : a.i.sid > b.i.sid ? 1 : 0) || ((a.i.round || 0) - (b.i.round || 0)) || (order.get(a.r.memberId) - order.get(b.r.memberId)) || (a.r.shotIndex - b.r.shotIndex);
  rows.sort(cmp);
  const lines = [SHOT_CSV_ALL_HEADERS.join(',')];
  const tally = new Map(), key = ({ r, i }) => `${i.sid}\u0000${i.round}\u0000${r.memberId}`;
  for (const x of rows) { const t = tally.get(key(x)) || { n: 0, hit: 0 }; t.n++; if (x.r.status === 'located' && isHit(x.r.x, x.r.y)) t.hit++; tally.set(key(x), t); }
  for (const x of rows) {
    const { r, i } = x, m = byId.get(r.memberId) || UNKNOWN, t = tally.get(key(x)), hit = r.status === 'located' && isHit(r.x, r.y), located = r.status === 'located';
    lines.push([hasNumber(m) ? String(m.number) : textCell(r.memberId), textCell(m.name), textCell(m.status), String(r.shotIndex + 1), hit ? MARK_HIT : MARK_MISS, `${t.n}射${t.hit}中`, located ? numCell(r.x) : '', located ? numCell(r.y) : '',
      textCell(i.sid), textCell(i.date), textCell(i.mode), String(i.round)].join(','));
  }
  return { csv: '\uFEFF' + lines.join('\r\n') + '\r\n', count: rows.length };
}

// ---- shot-export.js ----
// 射記録CSV用の読み取り専用の取得。shots・members・meta（練習メタデータだけ）を1つの readonly トランザクションで読む（書き込み・削除はしない）
// 練習メタデータが壊れている場合は、孤立した射として出力せず、CSV出力を拒否する（F-6）。本当にメタデータがない射（孤立した射）は従来どおり含める
// 非表示部員の射も、すべての練習（旧データ・新しい練習・練習情報のない射）も含めて全件返す（絞り込まない）
async function readShotExportData(db) {
  const tx = db.transaction(['shots', 'members', 'meta'], 'readonly');
  const s = tx.objectStore('shots').getAll(), m = tx.objectStore('members').getAll();
  const pm = tx.objectStore('meta').getAll(IDBKeyRange.bound(PRACTICE_PREFIX, 'practice;', false, true)); // 'practice:' で始まるキーだけ
  await done(tx);
  return { shots: s.result, members: m.result, practices: practiceValuesFromMeta(pm.result) }; // キーと値の整合性を確認する。壊れたメタデータは除外せず ShotCsvError（CSV出力の拒否）
}

// ---- roster-view.js ----
// 部員管理画面。氏名などの利用者入力はすべて textContent / value で扱い、innerHTML には入れない
function createRosterView({ doc, root, ops, getState }) {
  const st = { editing: null, hiding: null, msg: null, plan: null, choices: {}, busy: false, includeHiddenExport: false };
  const h = (tag, attrs, ...kids) => {
    const e = doc.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e[k] = v; else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : doc.createTextNode(String(c)));
    return e;
  };
  const say = (text, kind) => { st.msg = text ? { text, kind } : null; };
  const fmt = ms => { const d = new Date(ms); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
  const gradeText = g => g ? `${g}年` : '学年未設定';
  const numText = m => Number.isInteger(m.number) && m.number >= 1 ? `No.${m.number}　` : '';
  async function run(fn, okText) {
    if (st.busy) return; st.busy = true; render();
    try { const r = await fn(); say(okText ? (typeof okText === 'function' ? okText(r) : okText) : '', 'ok'); }
    catch (e) { say(e && e.message || String(e), 'err'); }
    st.busy = false; render();
  }
  const gradeSelect = (id, val) => h('select', { id }, [['', '未設定'], [1, '1年'], [2, '2年'], [3, '3年']].map(([v, t]) => h('option', { value: v, selected: String(val ?? '') === String(v) }, t)));
  const fieldBox = (label, input) => h('label', { class: 'fld' }, h('span', { text: label }), input);

  function addCard(canEdit) {
    const name = h('input', { id: 'addName', type: 'text', maxlength: 40, autocomplete: 'off' }), kana = h('input', { id: 'addKana', type: 'text', maxlength: 80, autocomplete: 'off' });
    const grade = gradeSelect('addGrade', ''), dup = h('input', { id: 'addDup', type: 'checkbox' });
    return h('div', { class: 'card' }, h('h2', { text: '部員を追加' }),
      h('div', { class: 'frm' }, fieldBox('氏名（必須）', name), fieldBox('ふりがな', kana), fieldBox('学年', grade)),
      h('label', {}, dup, '同姓同名でも別人として追加する'),
      h('div', { class: 'btns' }, h('button', { id: 'addBtn', disabled: !canEdit || st.busy, onclick: () => run(async () => { await ops.add({ name: name.value, kana: kana.value, grade: grade.value }, dup.checked); }, '追加しました') }, '追加')));
  }

  function activeCard(list, canEdit) {
    const card = h('div', { class: 'card', id: 'activeCard' }, h('h2', { text: `部員名簿（表示中 ${list.length}人）` }));
    if (!list.length) card.append(h('div', { class: 'note', text: '表示中の部員がいません。上のフォームか、CSVで登録してください。' }));
    list.forEach((m, i) => {
      const row = h('div', { class: 'mrow', 'data-id': m.id });
      if (st.editing === m.id) {
        const n = h('input', { type: 'text', value: m.name, maxlength: 40, class: 'eName' }), k = h('input', { type: 'text', value: m.kana || '', maxlength: 80, class: 'eKana' }), g = gradeSelect('', m.grade);
        g.className = 'eGrade';
        row.append(h('div', { class: 'frm' }, fieldBox('氏名', n), fieldBox('ふりがな', k), fieldBox('学年', g)),
          h('div', { class: 'btns' }, h('button', { class: 'eSave', disabled: st.busy, onclick: () => run(async () => { await ops.update(m.id, { name: n.value, kana: k.value, grade: g.value }); st.editing = null; }, '保存しました') }, '保存'), h('button', { onclick: () => { st.editing = null; say(''); render(); } }, 'キャンセル')));
      } else if (st.hiding === m.id) {
        const sel = h('select', { class: 'hReason' }, HIDDEN_REASONS.map(r => h('option', { value: r }, r)));
        row.append(h('div', {}, h('div', { class: 'nm', text: m.name }), h('small', { text: '非表示にする理由' }), sel),
          h('div', { class: 'btns' }, h('button', { class: 'hOk', disabled: st.busy, onclick: () => run(async () => { await ops.hide(m.id, sel.value); st.hiding = null; }, '非表示にしました（記録は残ります）') }, '非表示にする'), h('button', { onclick: () => { st.hiding = null; render(); } }, 'キャンセル')));
      } else {
        row.append(h('div', {}, h('div', { class: 'nm', text: `${numText(m)}${m.name}` }), h('small', { text: `${m.kana || 'ふりがな未設定'}　${gradeText(m.grade)}` })),
          h('div', { class: 'btns' },
            h('button', { class: 'up', 'aria-label': '上へ', disabled: !canEdit || st.busy || i === 0, onclick: () => run(() => ops.move(m.id, -1)) }, '↑'),
            h('button', { class: 'down', 'aria-label': '下へ', disabled: !canEdit || st.busy || i === list.length - 1, onclick: () => run(() => ops.move(m.id, 1)) }, '↓'),
            h('button', { class: 'edit', disabled: !canEdit || st.busy, onclick: () => { st.editing = m.id; st.hiding = null; say(''); render(); } }, '編集'),
            h('button', { class: 'hide', disabled: !canEdit || st.busy, onclick: () => { st.hiding = m.id; st.editing = null; say(''); render(); } }, '非表示')));
      }
      card.append(row);
    });
    return card;
  }

  function hiddenCard(list, canEdit) {
    if (!list.length) return null;
    const card = h('div', { class: 'card', id: 'hiddenCard' }, h('h2', { text: `非表示の部員（${list.length}人）` }), h('div', { class: 'note', text: '非表示でも過去の記録は残っています。再表示すると名簿の末尾に戻り、記録も復元されます。' }));
    for (const m of list) card.append(h('div', { class: 'mrow', 'data-id': m.id },
      h('div', {}, h('div', { class: 'nm', text: `${numText(m)}${m.name}` }), h('small', { text: `${m.hiddenReason || ''}（${m.hiddenAt ? fmt(m.hiddenAt) : ''}）` })),
      h('div', { class: 'btns' }, h('button', { class: 'show', disabled: !canEdit || st.busy, onclick: () => run(() => ops.show(m.id), '再表示しました（名簿の末尾）') }, '再表示'))));
    return card;
  }

  const KIND = { new: '新規', update: '更新候補', unchanged: '変更なし', dup_name: '同名', error: 'エラー' };
  function csvCard(canEdit) {
    const card = h('div', { class: 'card', id: 'csvCard' }, h('h2', { text: 'CSV' }));
    const file = h('input', { type: 'file', id: 'csvFile', accept: '.csv,.txt,text/csv', disabled: !canEdit || st.busy });
    file.onchange = () => { const f = file.files && file.files[0]; if (!f) return; run(async () => { st.plan = await ops.importPreview(f); st.choices = {}; }, r => ''); };
    card.append(h('div', { class: 'note', text: '列: 部員ID・氏名（必須）・ふりがな・学年。IDが空なら新規候補、IDが名簿と一致すれば更新候補です。文字コードは UTF-8（BOMあり・なし）と Shift_JIS に対応しています。' }), h('label', { class: 'fld' }, h('span', { text: 'CSVファイルを選ぶ' }), file));
    if (st.plan) {
      const p = st.plan;
      card.append(h('div', { class: p.errorCount ? 'err' : 'note', id: 'planSummary', text: `${p.rows.length}行を読み込みました（文字コード: ${p.encoding || '不明'}）。` + Object.entries(p.counts).map(([k, v]) => `${KIND[k]}${v}`).join('・') + (p.errorCount ? '　エラー行があるため取り込めません。CSVを直して選び直してください。' : '') }));
      const t = h('table', { class: 'prev' }, h('tr', {}, ['行', '判定', '氏名', 'ふりがな', '学年', '内容', '操作'].map(x => h('th', { text: x }))));
      for (const r of p.rows) {
        let op = '';
        const opts = r.kind === 'new' ? [['add', '追加する'], ['skip', '追加しない']] : r.kind === 'update' ? [['skip', '更新しない'], ['update', '更新する']] : r.kind === 'dup_name' ? [['skip', 'スキップ'], ['add', '別人として追加']] : null;
        if (opts) { op = h('select', { class: 'op', 'data-line': r.line, onchange: e => { st.choices[r.line] = e.target.value; } }, opts.map(([v, tx]) => h('option', { value: v, selected: (st.choices[r.line] ?? r.action) === v }, tx))); }
        const note = r.kind === 'update' ? r.changes.map(c => `${{ name: '氏名', kana: 'ふりがな', grade: '学年' }[c.field]}: ${c.from === '' ? '（空）' : c.from} → ${c.to === '' ? '（空）' : c.to}`).join(' / ') : (r.messages || []).join(' / ');
        t.append(h('tr', { class: r.kind }, h('td', { text: r.line }), h('td', { text: KIND[r.kind] }), h('td', { text: r.data.name }), h('td', { text: r.data.kana }), h('td', { text: r.data.grade ? `${r.data.grade}年` : '' }), h('td', { text: note }), h('td', {}, op)));
      }
      card.append(h('div', { style: 'overflow-x:auto' }, t),
        h('div', { class: 'btns' }, h('button', { id: 'csvApply', disabled: !canEdit || st.busy || p.errorCount > 0, onclick: () => run(() => ops.importApply(p, st.choices).then(r => { st.plan = null; st.choices = {}; return r; }), r => `取り込みました（追加${r.added}件・更新${r.updated}件）`) }, '取り込む'), h('button', { onclick: () => { st.plan = null; st.choices = {}; render(); } }, '取り消す')));
    }
    const inc = h('input', { type: 'checkbox', id: 'expHidden', checked: st.includeHiddenExport, onchange: e => { st.includeHiddenExport = e.target.checked; } });
    card.append(h('div', { class: 'btns' }, h('button', { id: 'csvExport', disabled: !canEdit || st.busy, onclick: () => run(async () => { ops.exportCsv(st.includeHiddenExport); }, 'CSVを書き出しました') }, 'CSVを書き出す'), h('label', {}, inc, '非表示の部員も含める')));
    return card;
  }

  function render() {
    const s = getState(), canEdit = s.canEdit && !s.syncing;
    root.replaceChildren();
    if (!s.canEdit) root.append(h('div', { class: 'card err', id: 'rosterDisabled', text: s.reason || '保存領域を使えないため、部員管理は表示のみです' }));
    if (st.msg) root.append(h('div', { class: st.msg.kind === 'err' ? 'err' : 'okmsg', id: 'rosterMsg', role: 'status', text: st.msg.text }));
    root.append(addCard(canEdit), activeCard(sortActive(s.members.slice()), canEdit));
    const hc = hiddenCard(sortHidden(s.members.slice()), canEdit); if (hc) root.append(hc);
    root.append(csvCard(canEdit));
  }
  return { render, state: st };
}

    const saved = await withTimeout(loadShots(d, members.map(m => m.id)), timeoutMs), init = {};
    for (const m of members) init[m.id] = saved[m.id] || Array(SHOTS).fill(null);
    activeMembers = members; store = makeStore(activeMembers, init); curSig = configSignature(roster);
    savedJson = JSON.stringify(store.state.records); unsaved = new Set();
    const k = keepId ? members.findIndex(m => m.id === keepId) : -1;
    if (k > 0) store.goto(k);
  }
  async function syncStore() {
    if (!db || syncing) return;
    await Promise.allSettled([...inflight]);
    for (const m of roster) { const a = activeMembers.find(x => x.id === m.id); if (a) a.name = m.name; } // 氏名などの編集はStoreを作り直さず反映
    if (configSignature(roster) === curSig) { deferred = false; return; }
    if (unsavedNow()) { deferred = true; return; } // 未保存データがあるときは再生成しない
    syncing = true; render();
    try { await rebuildStore(db, store ? activeMembers[store.state.mi].id : null); deferred = false; say(''); }
    catch (e) { deferred = true; say(`部員の読み込みに失敗しました（${e && e.message || e}）`, true); }
    syncing = false;
  }
  async function showTab(t) {
    tab = t;
    if (t === 'roster') { rosterView.render(); render(); return; }
    render(); await syncStore(); render();
  }
  $('tabRec').onclick = () => showTab('rec');
  $('tabRoster').onclick = () => showTab('roster');

  // 画面の描画とボタン登録を先に済ませ、IndexedDBは後から非同期で準備する（応答しなくても画面は動く）
  render(); rosterView.render();
  const ready = (async () => {
    let d = null, practiceFailed = false;
    try {
      d = await withTimeout(openDb({ idb, onBlocked: () => { blocked = true; say('他のタブやホーム画面のアプリを閉じてください（データベース更新待ち）', true); }, onVersionChange: () => {
        db = null; locked = true; lockKind = 'versionchange'; lockInfo = {}; drag = null; deferred = false; saveState = 'unavailable'; saveReason = '別のタブで保存領域が更新されました'; // 接続は openDb 側で閉じ済み。表示中の記録は消さない
        say(lockMsg(), true); render(); rosterView.render();
      } }), timeoutMs, late => late.close());
      // 練習情報（activePractice・練習レコード・対象練習の射）を先に確認する。読めない・不整合・この版で扱えない練習なら、旧データへフォールバックせず、Storeを作らずに停止する
      let ps; try { ps = await withTimeout(loadPracticeState(d), timeoutMs); } catch (e) { practiceFailed = true; throw e; }
      if (ps.kind === 'inconsistent' || ps.kind === 'ok') { try { d.close(); } catch {} lockApp(ps.kind === 'ok' ? 'unsupported' : 'inconsistent', ps); dbPending = false; render(); rosterView.render(); return; }
      roster = await withTimeout(listMembers(d), timeoutMs);
      if (roster.some(m => !hasNumber(m))) { // 番号機能の追加前に登録した部員へ、登録順に部員番号を振る（失敗しても名簿・記録は使える）
        try { await withTimeout(assignMissingNumbers(d), timeoutMs); roster = await withTimeout(listMembers(d), timeoutMs); } catch {}
      }
      await rebuildStore(d, null);
      db = d; saveState = 'ok'; say('');
    } catch (e) {
      if (d) { try { d.close(); } catch {} }
      saveState = 'unavailable'; saveReason = blocked ? '他のタブが使用中です' : (practiceFailed ? '練習情報の読み込みに失敗: ' : '') + `${e && e.name || ''} ${e && e.message || ''}`.trim() || '原因不明';
      say(`部員名簿を読み込めません（${saveReason}）。${blocked ? '他のタブやホーム画面のアプリを閉じて、' : ''}保存領域を確認し、再読み込みしてください`, true);
      // 名簿または保存済みの記録を正常に読めないときは、記録画面を使えない状態にする（仮名簿・一部だけの名簿では記録させない）
      store = null; activeMembers = []; curSig = ''; savedJson = ''; unsaved = new Set(); roster = [];
    }
    dbPending = false; render(); rosterView.render();
  })();
  return { ready, api: { getStore: () => store, exportShotCsv, getRoster: () => roster, getDb: () => db, showTab, ops, state: () => ({ saveState, saveReason, unsaved: new Set(unsaved), deferred, tab, syncing, dbPending }) } };
}

startApp();

</script>
