<script type="module">
// ---- geometry.js ----
// 純粋関数のみ。座標系: 的中心が原点、的半径=1.0、右が+x、下が+y（射手から的を正面に見た向き）
const HIT_RADIUS = 1.0, BOUNDARY_BAND = 0.10, MAX_ABS = 10, VIEW_HALF = 2.0;
const EPS = 1e-12;
const radius = (x, y) => Math.hypot(x, y);
const isHit = (x, y, hitR = HIT_RADIUS) => radius(x, y) <= hitR + EPS; // 円周を含む
const isNearBoundary = (x, y, hitR = HIT_RADIUS) => Math.abs(radius(x, y) - hitR) <= BOUNDARY_BAND + EPS; // 注意表示のみ
function validatePosition(x, y) {
  if (!Number.isFinite(x) || !Number.isFinite(y)) return { ok: false, reason: '座標が数値ではないため保存しません' };
  if (Math.abs(x) > MAX_ABS || Math.abs(y) > MAX_ABS) return { ok: false, reason: `|x|または|y|が${MAX_ABS}を超えるため、誤入力防止で保存しません` };
  return { ok: true };
}
// 画面座標(px,py) → 保存座標。rectは正方形のSVG要素のgetBoundingClientRect()。flipは表示だけの左右反転
function pointToWorld(px, py, rect, { half = VIEW_HALF, flip = false } = {}) {
  const sx = ((px - rect.left) / rect.width * 2 - 1) * half;
  return { x: flip ? 0 - sx : sx, y: ((py - rect.top) / rect.height * 2 - 1) * half };
}
function worldToPoint(x, y, rect, { half = VIEW_HALF, flip = false } = {}) {
  const sx = flip ? 0 - x : x;
  return { px: rect.left + (sx / half + 1) / 2 * rect.width, py: rect.top + (y / half + 1) / 2 * rect.height };
}

// ---- store.js ----
const SHOTS = 4;
const clone = o => JSON.parse(JSON.stringify(o));
// 射レコード: null=未入力 / {status:'located',x,y} / {status:'unlocated_miss'}。的中/外れは座標から算出し保存しない
function createStore(members, init = {}) {
  const s = { members, records: {}, mi: 0, sel: 0 };
  for (const m of members) s.records[m.id] = init[m.id] ? clone(init[m.id]) : Array(SHOTS).fill(null);
  const undoStack = [], subs = [];
  const emit = (dirty = false) => subs.forEach(f => f(s, dirty));
  const rec = () => s.records[members[s.mi].id];
  const firstEmpty = a => { const k = a.indexOf(null); return k < 0 ? null : k; };
  const snap = () => clone({ records: s.records, mi: s.mi, sel: s.sel });
  const push = p => { if (JSON.stringify(p.records) !== JSON.stringify(s.records)) undoStack.push(p); };
  s.sel = firstEmpty(rec());
  return {
    state: s, snap, canUndo: () => undoStack.length > 0,
    subscribe: f => subs.push(f),
    restore(p) { Object.assign(s, clone(p)); emit(true); },
    select(i) { s.sel = i; emit(); },
    place(i, x, y) { const v = validatePosition(x, y); if (!v.ok) return v; rec()[i] = { status: 'located', x, y }; emit(); return v; },
    settle(before) { push(before); s.sel = firstEmpty(rec()); emit(true); }, // タップ/ドラッグ確定。Undoは1件
    unlocated(i) { const p = snap(); rec()[i] = { status: 'unlocated_miss' }; push(p); s.sel = firstEmpty(rec()); emit(true); },
    remove(i) { if (!rec()[i]) return false; const p = snap(); rec()[i] = null; push(p); s.sel = i; emit(true); return true; },
    undo() { const p = undoStack.pop(); if (p) this.restore(p); return !!p; },
    goto(k) { if (k < 0 || k >= members.length) return false; s.mi = k; s.sel = firstEmpty(rec()); emit(); return true; },
    next() { return this.goto(s.mi + 1); }, prev() { return this.goto(s.mi - 1); },
  };
}
// 的中率の分母は記録済みの射数（未入力は含めない。位置不明の外れは含める）
const statsOf = arr => { const d = arr.filter(Boolean); return { recorded: d.length, hits: d.filter(r => r.status === 'located' && isHit(r.x, r.y)).length }; };
const totalStats = recs => Object.values(recs).map(statsOf).reduce((a, b) => ({ recorded: a.recorded + b.recorded, hits: a.hits + b.hits }), { recorded: 0, hits: 0 });

// ---- db.js ----
// DB v2（STEP 2-A）。DB名は STEP 1 から変更しない。
const NAME = 'kyudo-hit-position', VERSION = 2, SESSION = 'test-session';

// 移行は versionchange トランザクション内で実行される。例外が出たら abort し、DBは移行前のまま残る
const migrations = {
  1(db) { db.createObjectStore('shots', { keyPath: 'id' }); db.createObjectStore('meta', { keyPath: 'key' }); },
  2(db, tx) { // STEP 1のテスト用shotsは破棄してよい（承認済み）。metaには触れない
    const shots = tx.objectStore('shots');
    shots.clear();
    shots.createIndex('byMember', 'memberId');
    db.createObjectStore('members', { keyPath: 'id' });
  },
};

// opts: { idb, name, version, migrations, hooks:{afterMigrate(v,db,tx)}（テスト用）, onBlocked(), onVersionChange() }
const openDb = (opts = {}) => new Promise((res, rej) => {
  const { idb = globalThis.indexedDB, name = NAME, version = VERSION, migrations: mg = migrations, hooks = {}, onBlocked, onVersionChange } = opts;
  let failure = null;
  const q = idb.open(name, version);
  q.onupgradeneeded = e => {
    try {
      for (let v = e.oldVersion + 1; v <= e.newVersion; v++) {
        mg[v](q.result, q.transaction);
        if (hooks.afterMigrate) hooks.afterMigrate(v, q.result, q.transaction);
      }
    } catch (err) { failure = err; try { q.transaction.abort(); } catch {} } // 全体を破棄し、中途半端なDB状態を残さない
  };
  // blocked: 他の接続が閉じるまで待つ。即座には失敗にせず、呼び出し側のタイムアウトに任せる
  q.onblocked = () => { if (onBlocked) onBlocked(); };
  q.onsuccess = () => {
    const d = q.result;
    d.onversionchange = () => { try { d.close(); } catch {} if (onVersionChange) onVersionChange(); };
    res(d);
  };
  q.onerror = () => rej(failure || q.error);
});

const done = tx => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = tx.onabort = () => rej(tx.error || new Error('トランザクションが中止されました')); });

// memberIds を渡したときは、その部員の射だけを返す（非表示部員の記録は読まない）
async function loadShots(db, memberIds) {
  const want = memberIds ? new Set(memberIds) : null;
  const tx = db.transaction('shots'), q = tx.objectStore('shots').getAll(); await done(tx);
  const out = {};
  for (const r of q.result) if (r.sessionId === SESSION && (!want || want.has(r.memberId)))
    (out[r.memberId] || (out[r.memberId] = Array(SHOTS).fill(null)))[r.shotIndex] = r.status === 'located' ? { status: 'located', x: r.x, y: r.y } : { status: 'unlocated_miss' };
  return out;
}

const okShot = r => r === null || (!!r && ((r.status === 'located' && Number.isFinite(r.x) && Number.isFinite(r.y)) || r.status === 'unlocated_miss'));
function validateByMember(byMember) {
  if (!byMember || typeof byMember !== 'object') throw new TypeError('保存対象の部員が指定されていません');
  const ids = Object.keys(byMember);
  if (!ids.length) throw new TypeError('保存対象の部員が空です');
  for (const id of ids) {
    if (!id || id.includes(':')) throw new TypeError(`部員IDが不正です: ${id}`);
    const a = byMember[id];
    if (!Array.isArray(a) || a.length !== SHOTS || !a.every(okShot)) throw new TypeError(`射データが不正です: ${id}`);
  }
  return ids;
}

// 指定した部員の射だけを置き換える。削除・置換は単一トランザクション。成功は tx.oncomplete でのみ判定する
// 他の部員（非表示部員を含む）のレコードには一切触れない
function saveMemberShots(db, byMember) {
  let ids;
  try { ids = validateByMember(byMember); } catch (e) { return Promise.reject(e); } // トランザクションを開く前に拒否
  const tx = db.transaction('shots', 'readwrite'), st = tx.objectStore('shots'), idx = st.index('byMember'), now = Date.now();
  const p = done(tx);
  let left = ids.length;
  const stale = [];
  for (const mid of ids) {
    const rq = idx.getAll(IDBKeyRange.only(mid));
    rq.onsuccess = () => {
      for (const r of rq.result) if (r.sessionId === SESSION) stale.push(r.id);
      if (--left) return;
      for (const k of stale) st.delete(k); // 先に削除してから…
      for (const m2 of ids) byMember[m2].forEach((r, i) => { // …新しい射を書く
        if (r) st.put({ id: `${SESSION}:${m2}:${i}`, sessionId: SESSION, memberId: m2, shotIndex: i, status: r.status, ...(r.status === 'located' ? { x: r.x, y: r.y } : {}), updatedAt: now });
      });
    };
  }
  return p;
}

// ---- roster.js ----
// 部員データの形・検証・順序（純粋関数。DBやDOMには触れない）
// 部員: { id, name, kana, grade, status, hiddenReason, hiddenAt, sortOrder, createdAt, updatedAt }
const STATUS_ACTIVE = 'active', STATUS_HIDDEN = 'hidden';
const HIDDEN_REASONS = ['退部', '卒業', '誤登録', 'その他'];
const NAME_MAX = 40, KANA_MAX = 80;

// 氏名・ふりがな: NFKC正規化、連続空白を1つにして前後を除く
const cleanText = s => String(s == null ? '' : s).normalize('NFKC').replace(/\s+/g, ' ').trim();
// 氏名の同一判定用: 空白をすべて除いて比較
const nameKey = s => cleanText(s).replace(/\s/g, '');
// 学年: 空→null、1/2/3（全角・「1年」可）→数値、それ以外→NaN
function parseGrade(v) {
  const t = cleanText(v);
  if (t === '') return null;
  const m = /^([123])年?$/.exec(t);
  return m ? +m[1] : NaN;
}
const isDangerousLead = s => /^[=+\-@\t\r]/.test(s);

function makeId(cryptoObj = globalThis.crypto) {
  let u;
  if (cryptoObj && cryptoObj.randomUUID) u = cryptoObj.randomUUID();
  else {
    const b = new Uint8Array(16); cryptoObj.getRandomValues(b);
    u = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  return 'm_' + u.replace(/-/g, '');
}

function validateFields({ name, kana, grade }) {
  const errors = [];
  const n = cleanText(name), k = cleanText(kana), g = grade === undefined || grade === null || grade === '' ? null : (typeof grade === 'number' ? (grade >= 1 && grade <= 3 && Number.isInteger(grade) ? grade : NaN) : parseGrade(grade));
  if (!n) errors.push('氏名は必須です');
  if (n.length > NAME_MAX) errors.push(`氏名は${NAME_MAX}文字までです`);
  if (k.length > KANA_MAX) errors.push(`ふりがなは${KANA_MAX}文字までです`);
  if (Number.isNaN(g)) errors.push('学年は 1・2・3 または空欄にしてください');
  return { ok: !errors.length, errors, value: { name: n, kana: k, grade: Number.isNaN(g) ? null : g } };
}

function validateMember(m) {
  if (!m) return { ok: false, errors: ['部員データがありません'] };
  const errors = [];
  if (!m || typeof m.id !== 'string' || !m.id || m.id.includes(':')) errors.push('部員IDが不正です');
  const f = validateFields(m || {}); errors.push(...f.errors);
  if (m.status !== STATUS_ACTIVE && m.status !== STATUS_HIDDEN) errors.push('statusが不正です');
  if (m.status === STATUS_HIDDEN && (!m.hiddenReason || !Number.isFinite(m.hiddenAt))) errors.push('非表示には理由と日時が必要です');
  if (m.status === STATUS_ACTIVE && (m.hiddenReason != null || m.hiddenAt != null)) errors.push('表示中の部員に非表示情報があります');
  if (!Number.isFinite(m.sortOrder)) errors.push('sortOrderが不正です');
  return { ok: !errors.length, errors };
}

const newMember = (fields, { id, now, sortOrder }) => {
  const f = validateFields(fields);
  if (!f.ok) throw new Error(f.errors.join(' / '));
  return { id, ...f.value, status: STATUS_ACTIVE, hiddenReason: null, hiddenAt: null, sortOrder, createdAt: now, updatedAt: now };
};
const hideMember = (m, reason, now) => {
  if (!reason) throw new Error('非表示の理由が必要です');
  return { ...m, status: STATUS_HIDDEN, hiddenReason: reason, hiddenAt: now, updatedAt: now };
};
// 再表示すると名簿の末尾に戻る
const showMember = (m, now, sortOrder) => ({ ...m, status: STATUS_ACTIVE, hiddenReason: null, hiddenAt: null, sortOrder, updatedAt: now });

const byOrder = (a, b) => (a.sortOrder - b.sortOrder) || (a.createdAt - b.createdAt) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
const sortActive = ms => ms.filter(m => m.status === STATUS_ACTIVE).sort(byOrder);
const sortHidden = ms => ms.filter(m => m.status === STATUS_HIDDEN).sort((a, b) => (a.hiddenAt - b.hiddenAt) || byOrder(a, b));
const nextSortOrder = ms => ms.reduce((mx, m) => Math.max(mx, m.sortOrder), -1) + 1; // 全部員（非表示を含む）の最大値+1
// 部員構成 = 有効部員のIDの並び。氏名などの編集では変わらない
const configSignature = ms => sortActive(ms).map(m => m.id).join('|');

// ---- roster-store.js ----
// membersストアのCRUD。部員の削除機能はない（非表示のみ）。書き込みはすべて単一トランザクション
const get = (st, id) => new Promise((res, rej) => { const q = st.get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const all = st => new Promise((res, rej) => { const q = st.getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const fail = (tx, msg) => { try { tx.abort(); } catch {} const e = new Error(msg); e.name = 'RosterError'; return e; };

async function listMembers(db) {
  const tx = db.transaction('members'), q = all(tx.objectStore('members')); const p = done(tx);
  const r = await q; await p; return r;
}

// opts: { now, id, allowDuplicate }。同姓同名は allowDuplicate が true のときだけ別人として追加できる
async function addMember(db, fields, opts = {}) {
  const now = opts.now ?? Date.now(), v = validateFields(fields);
  if (!v.ok) throw new Error(v.errors.join(' / '));
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx);
  p.catch(() => {});
  const cur = await all(st);
  if (!opts.allowDuplicate && cur.some(m => nameKey(m.name) === nameKey(v.value.name))) throw fail(tx, '同じ氏名の部員がすでにいます');
  const id = opts.id || makeId();
  if (cur.some(m => m.id === id)) throw fail(tx, '部員IDが重複しました');
  const m = newMember(fields, { id, now, sortOrder: nextSortOrder(cur) });
  st.put(m); await p; return m;
}

async function updateMember(db, id, fields, opts = {}) {
  const now = opts.now ?? Date.now(), v = validateFields(fields);
  if (!v.ok) throw new Error(v.errors.join(' / '));
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx); p.catch(() => {});
  const cur = await get(st, id);
  if (!cur) throw fail(tx, '部員が見つかりません');
  const m = { ...cur, ...v.value, updatedAt: now }; // IDは変えない
  st.put(m); await p; return m;
}

async function setHidden(db, id, reason, opts = {}) {
  const now = opts.now ?? Date.now();
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx); p.catch(() => {});
  const cur = await get(st, id);
  if (!cur) throw fail(tx, '部員が見つかりません');
  if (cur.status === 'hidden') throw fail(tx, 'すでに非表示です');
  const m = hideMember(cur, reason, now); st.put(m); await p; return m;
}

async function setShown(db, id, opts = {}) {
  const now = opts.now ?? Date.now();
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx); p.catch(() => {});
  const cur = await get(st, id);
  if (!cur) throw fail(tx, '部員が見つかりません');
  if (cur.status === 'active') throw fail(tx, 'すでに表示中です');
  const m = showMember(cur, now, nextSortOrder(await all(st))); // 名簿の末尾に戻す
  st.put(m); await p; return m;
}

// dir: -1=上へ, +1=下へ。有効部員の順序を 0..n-1 に振り直して入れ替える（単一トランザクション）
async function moveMember(db, id, dir, opts = {}) {
  const now = opts.now ?? Date.now();
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx); p.catch(() => {});
  const act = sortActive(await all(st)), i = act.findIndex(m => m.id === id), j = i + dir;
  if (i < 0) throw fail(tx, '表示中の部員が見つかりません');
  if (j < 0 || j >= act.length) { tx.abort(); return false; }
  [act[i], act[j]] = [act[j], act[i]];
  act.forEach((m, k) => { if (m.sortOrder !== k || m.id === act[i].id || m.id === act[j].id) st.put({ ...m, sortOrder: k, updatedAt: m.sortOrder === k ? m.updatedAt : now }); });
  await p; return true;
}

// CSV取り込みの一括反映。全件を単一トランザクションで適用し、1件でも不正なら全件を戻す
// ops: { adds:[{name,kana,grade}], updates:[{id,name,kana,grade}] }
async function applyImport(db, ops, opts = {}) {
  const now = opts.now ?? Date.now();
  const tx = db.transaction('members', 'readwrite'), st = tx.objectStore('members'), p = done(tx); p.catch(() => {});
  const cur = await all(st), byId = new Map(cur.map(m => [m.id, m])), seen = new Set();
  const out = [];
  for (const u of ops.updates || []) {
    const old = byId.get(u.id);
    if (!old) throw fail(tx, `存在しない部員IDです: ${u.id}`);
    if (seen.has(u.id)) throw fail(tx, `部員IDが重複しています: ${u.id}`);
    seen.add(u.id);
    const v = validateFields(u); if (!v.ok) throw fail(tx, v.errors.join(' / '));
    out.push({ ...old, ...v.value, updatedAt: now });
  }
  let order = nextSortOrder(cur);
  for (const a of ops.adds || []) {
    let id; do { id = makeId(); } while (byId.has(id) || seen.has(id));
    seen.add(id);
    const v = validateFields(a); if (!v.ok) throw fail(tx, v.errors.join(' / '));
    out.push(newMember(a, { id, now, sortOrder: order++ }));
  }
  for (const m of out) { const r = validateMember(m); if (!r.ok) throw fail(tx, r.errors.join(' / ')); st.put(m); }
  await p; return { added: (ops.adds || []).length, updated: (ops.updates || []).length };
}

// ---- csv.js ----
// CSVの文字コード判定・解析・取り込み計画・書き出し（純粋関数）
class CsvError extends Error { constructor(code, message) { super(message); this.name = 'CsvError'; this.code = code; } }

const u8 = b => b instanceof Uint8Array ? b : new Uint8Array(b);
// UTF-8 BOMあり→UTF-8（不正ならエラー）／BOMなし→厳密UTF-8、だめならShift_JIS（置換文字が出たらエラー）
function decodeCsv(bytes, TD = globalThis.TextDecoder) {
  const b = u8(bytes);
  if (b.length >= 2 && ((b[0] === 0xFF && b[1] === 0xFE) || (b[0] === 0xFE && b[1] === 0xFF))) throw new CsvError('utf16', 'UTF-16 のファイルには対応していません。UTF-8 または Shift_JIS で保存し直してください');
  const strict = new TD('utf-8', { fatal: true, ignoreBOM: true });
  if (b.length >= 3 && b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) {
    try { return { text: strict.decode(b.subarray(3)), encoding: 'utf-8-bom' }; } catch { throw new CsvError('invalid_utf8', 'BOM付きUTF-8として読めませんでした（文字コードが壊れています）'); }
  }
  try { return { text: strict.decode(b), encoding: 'utf-8' }; } catch {}
  try {
    const t = new TD('shift_jis', { fatal: true }).decode(b);
    if (t.includes('\uFFFD')) throw 0;
    return { text: t, encoding: 'shift_jis' };
  } catch { throw new CsvError('unknown_encoding', '文字コードを判定できませんでした（UTF-8 または Shift_JIS で保存してください）'); }
}

// RFC4180相当。引用符・"" ・CRLF/LF/CR・セル内改行。空行は読み飛ばす
function parseCsv(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], f = '', q = false, i = 0, any = false;
  const endField = () => { row.push(f); f = ''; };
  const endRow = () => { endField(); if (!(row.length === 1 && row[0] === '' && !any)) rows.push(row); row = []; any = false; };
  while (i < text.length) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i += 2; continue; } q = false; i++; continue; }
      f += c; i++; continue;
    }
    if (c === '"' && f === '' ) { q = true; any = true; i++; continue; }
    if (c === '"') throw new CsvError('bad_quote', `引用符の位置が不正です（${rows.length + 1}行目付近）`);
    if (c === ',') { endField(); any = true; i++; continue; }
    if (c === '\r') { endRow(); i += text[i + 1] === '\n' ? 2 : 1; continue; }
    if (c === '\n') { endRow(); i++; continue; }
    f += c; any = true; i++;
  }
  if (q) throw new CsvError('unterminated_quote', '引用符が閉じられていません');
  if (f !== '' || row.length || any) endRow();
  return rows;
}

// 数式インジェクション対策: 書き出し時に先頭へ ' を付け、取り込み時に1つだけ外す
const guardFormula = s => isDangerousLead(s) ? "'" + s : s;
const unguardFormula = s => /^'[=+\-@\t\r]/.test(s) ? s.slice(1) : s;

const HEADERS = { id: '部員ID', name: '氏名', kana: 'ふりがな', grade: '学年' };
// 取り込み計画。kind: new / update / unchanged / dup_name / error。既定の action: new→add、それ以外→skip（updateは明示選択）
function buildPlan(rows, existing) {
  if (!rows.length) throw new CsvError('empty', 'CSVが空です');
  const head = rows[0].map(h => cleanText(unguardFormula(h)));
  const col = {};
  for (const k of Object.keys(HEADERS)) {
    const idx = head.reduce((a, h, i) => h === HEADERS[k] ? a.concat(i) : a, []);
    if (idx.length > 1) throw new CsvError('dup_header', `見出し「${HEADERS[k]}」が重複しています`);
    col[k] = idx.length ? idx[0] : -1;
  }
  if (col.name < 0) throw new CsvError('no_name_header', '見出し行に「氏名」がありません');
  const byId = new Map(existing.map(m => [m.id, m])), idCount = new Map();
  const cell = (r, k) => col[k] < 0 ? '' : unguardFormula(r[col[k]] == null ? '' : r[col[k]]);
  const data = rows.slice(1).map((r, n) => ({ line: n + 2, id: cleanText(cell(r, 'id')), raw: r }));
  for (const d of data) if (d.id) idCount.set(d.id, (idCount.get(d.id) || 0) + 1);
  const exKeys = new Map(); for (const m of existing) exKeys.set(nameKey(m.name), m);
  const newKeys = new Set();
  const out = data.map(d => {
    const base = { line: d.line, id: d.id, messages: [] };
    const f = validateFields({ name: cell(d.raw, 'name'), kana: cell(d.raw, 'kana'), grade: cell(d.raw, 'grade') });
    const wrongGrade = f.errors.some(e => e.startsWith('学年'));
    if (!f.ok) return { ...base, kind: 'error', action: 'none', data: f.value, messages: f.errors };
    const v = f.value;
    if (d.id) {
      if (d.id.includes(':')) return { ...base, kind: 'error', action: 'none', data: v, messages: ['部員IDに使えない文字（:）があります'] };
      if (idCount.get(d.id) > 1) return { ...base, kind: 'error', action: 'none', data: v, messages: ['CSV内で同じ部員IDが重複しています'] };
      const ex = byId.get(d.id);
      if (!ex) return { ...base, kind: 'error', action: 'none', data: v, messages: ['この部員IDは名簿にありません（IDを空にすると新規候補になります）'] };
      const changes = ['name', 'kana', 'grade'].filter(k => (ex[k] ?? (k === 'grade' ? null : '')) !== v[k]).map(k => ({ field: k, from: ex[k] ?? '', to: v[k] ?? '' }));
      return changes.length ? { ...base, kind: 'update', action: 'skip', data: v, existing: ex, changes } : { ...base, kind: 'unchanged', action: 'skip', data: v, existing: ex, changes: [] };
    }
    const key = nameKey(v.name), hit = exKeys.get(key);
    if (hit || newKeys.has(key)) { newKeys.add(key); return { ...base, kind: 'dup_name', action: 'skip', data: v, existing: hit || null, messages: [hit ? (hit.status === 'hidden' ? '同じ氏名の非表示部員がいます' : '同じ氏名の部員がいます') : 'CSV内に同じ氏名の行があります'] }; }
    newKeys.add(key);
    return { ...base, kind: 'new', action: 'add', data: v };
  });
  const counts = out.reduce((a, r) => (a[r.kind] = (a[r.kind] || 0) + 1, a), {});
  return { rows: out, errorCount: counts.error || 0, counts, hasEncodingWarning: false };
}

// choices: Map/obj  line→'add'|'update'|'skip'。エラー行が1つでもあれば取り込めない
function selectOps(plan, choices = {}) {
  if (plan.errorCount) throw new CsvError('has_errors', `エラー行が${plan.errorCount}件あるため取り込めません。CSVを直してもう一度選んでください`);
  const get = r => (choices instanceof Map ? choices.get(r.line) : choices[r.line]) ?? r.action;
  const adds = [], updates = [];
  for (const r of plan.rows) {
    const a = get(r);
    if (a === 'add' && (r.kind === 'new' || r.kind === 'dup_name')) adds.push(r.data);
    else if (a === 'update' && r.kind === 'update') updates.push({ id: r.id, ...r.data });
  }
  return { adds, updates };
}

const q = s => /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
const cellOut = v => q(guardFormula(v == null ? '' : String(v)));
// UTF-8 BOM付き・CRLF（Excelでそのまま開ける）。既定は有効部員のみ
function toCsv(members, { includeHidden = false } = {}) {
  const list = sortActive(members.slice()).concat(includeHidden ? sortHidden(members.slice()) : []);
  const lines = [[HEADERS.id, HEADERS.name, HEADERS.kana, HEADERS.grade].join(',')];
  for (const m of list) lines.push([cellOut(m.id), cellOut(m.name), cellOut(m.kana), cellOut(m.grade)].join(','));
  return '\uFEFF' + lines.join('\r\n') + '\r\n';
}

// ---- shot-csv.js ----
// 射記録CSV（純粋関数。DBやDOMには触れない）。部員CSV（csv.js）とは別の処理で、guardFormula は使わない
// 列: member_id, member_name, member_status, shot_number, shot_status, result, x, y
const SHOT_CSV_HEADERS = ['member_id', 'member_name', 'member_status', 'shot_number', 'shot_status', 'result', 'x', 'y'];
class ShotCsvError extends Error { constructor(code, msg) { super(msg); this.name = 'ShotCsvError'; this.code = code; } }

// 文字列列: 先頭が = + - @ タブ CR のとき ' を付け、カンマ・引用符・改行を含むときは "..." で囲む
const textCell = s => { const t = String(s == null ? '' : s), g = isDangerousLead(t) ? "'" + t : t; return /[",\r\n]/.test(g) ? '"' + g.replace(/"/g, '""') + '"' : g; };
// 数値列（x, y）: 保存値をそのまま文字にする。数式対策・丸め・符号変更はしない（-0 も符号を残す）
const numCell = v => Object.is(v, -0) ? '-0' : String(v);

// 端末のローカル日付（toISOString は使わない）
const shotCsvFileName = (d = new Date()) => { const p = n => String(n).padStart(2, '0'); return `射記録_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.csv`; };

const UNKNOWN = { name: '', status: 'unknown' }; // 対応する部員がいない射（通常は発生しない）。落とさずに出す

function checkShot(r) {
  if (!r || typeof r !== 'object') throw new ShotCsvError('bad_record', '射記録の形が不正です');
  if (typeof r.memberId !== 'string' || !r.memberId) throw new ShotCsvError('bad_record', '射記録に部員IDがありません');
  if (!Number.isInteger(r.shotIndex) || r.shotIndex < 0 || r.shotIndex > 3) throw new ShotCsvError('bad_record', `射番号が不正です（${r.memberId}）`);
  if (r.status === 'located') { if (!Number.isFinite(r.x) || !Number.isFinite(r.y)) throw new ShotCsvError('bad_record', `座標が数値ではありません（${r.memberId} の${r.shotIndex + 1}射目）`); }
  else if (r.status !== 'unlocated_miss') throw new ShotCsvError('bad_record', `状態が不正です（${r.memberId} の${r.shotIndex + 1}射目）`);
}

// shots: DBの射レコード（保存済みのものだけ）。members: DBの全部員（非表示を含む）
// 戻り値: { csv, count }。出力する射が0件のときは ShotCsvError('empty') を投げる（空のCSVを成功扱いにしない）
function buildShotCsv(shots, members) {
  if (!Array.isArray(shots) || !shots.length) throw new ShotCsvError('empty', '出力できる保存済み射記録がありません');
  for (const r of shots) checkShot(r);
  const byId = new Map(members.map(m => [m.id, m]));
  // 並び順: 有効部員（名簿順）→ 非表示部員 → 対応する部員がいないID。各部員の中は射番号順
  const order = new Map(); let k = 0;
  for (const m of sortActive(members.slice()).concat(sortHidden(members.slice()))) order.set(m.id, k++);
  const orphans = [...new Set(shots.map(r => r.memberId).filter(id => !byId.has(id)))].sort();
  for (const id of orphans) order.set(id, k++);
  const rows = shots.slice().sort((a, b) => (order.get(a.memberId) - order.get(b.memberId)) || (a.shotIndex - b.shotIndex));
  const lines = [SHOT_CSV_HEADERS.join(',')];
  for (const r of rows) {
    const m = byId.get(r.memberId) || UNKNOWN, located = r.status === 'located';
    lines.push([textCell(r.memberId), textCell(m.name), textCell(m.status), String(r.shotIndex + 1), textCell(r.status),
      textCell(located ? (isHit(r.x, r.y) ? '的中' : '外れ') : '位置不明'), located ? numCell(r.x) : '', located ? numCell(r.y) : ''].join(','));
  }
  return { csv: '\uFEFF' + lines.join('\r\n') + '\r\n', count: rows.length };
}

// ---- shot-export.js ----
// 射記録CSV用の読み取り専用の取得。shots と members を1つの readonly トランザクションで読む（書き込み・削除はしない）
// 非表示部員の射も含めて全件返す（membersの状態では絞り込まない）
async function readShotExportData(db) {
  const tx = db.transaction(['shots', 'members'], 'readonly');
  const s = tx.objectStore('shots').getAll(), m = tx.objectStore('members').getAll();
  await done(tx);
  return { shots: s.result.filter(r => r.sessionId === SESSION), members: m.result };
}

// ---- roster-view.js ----
// 部員管理画面。氏名などの利用者入力はすべて textContent / value で扱い、innerHTML には入れない
function createRosterView({ doc, root, ops, getState }) {
  const st = { editing: null, hiding: null, msg: null, plan: null, choices: {}, busy: false, includeHiddenExport: false };
  const h = (tag, attrs, ...kids) => {
    const e = doc.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e[k] = v; else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : doc.createTextNode(String(c)));
    return e;
  };
  const say = (text, kind) => { st.msg = text ? { text, kind } : null; };
  const fmt = ms => { const d = new Date(ms); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
  const gradeText = g => g ? `${g}年` : '学年未設定';
  async function run(fn, okText) {
    if (st.busy) return; st.busy = true; render();
    try { const r = await fn(); say(okText ? (typeof okText === 'function' ? okText(r) : okText) : '', 'ok'); }
    catch (e) { say(e && e.message || String(e), 'err'); }
    st.busy = false; render();
  }
  const gradeSelect = (id, val) => h('select', { id }, [['', '未設定'], [1, '1年'], [2, '2年'], [3, '3年']].map(([v, t]) => h('option', { value: v, selected: String(val ?? '') === String(v) }, t)));
  const fieldBox = (label, input) => h('label', { class: 'fld' }, h('span', { text: label }), input);

  function addCard(canEdit) {
    const name = h('input', { id: 'addName', type: 'text', maxlength: 40, autocomplete: 'off' }), kana = h('input', { id: 'addKana', type: 'text', maxlength: 80, autocomplete: 'off' });
    const grade = gradeSelect('addGrade', ''), dup = h('input', { id: 'addDup', type: 'checkbox' });
    return h('div', { class: 'card' }, h('h2', { text: '部員を追加' }),
      h('div', { class: 'frm' }, fieldBox('氏名（必須）', name), fieldBox('ふりがな', kana), fieldBox('学年', grade)),
      h('label', {}, dup, '同姓同名でも別人として追加する'),
      h('div', { class: 'btns' }, h('button', { id: 'addBtn', disabled: !canEdit || st.busy, onclick: () => run(async () => { await ops.add({ name: name.value, kana: kana.value, grade: grade.value }, dup.checked); }, '追加しました') }, '追加')));
  }

  function activeCard(list, canEdit) {
    const card = h('div', { class: 'card', id: 'activeCard' }, h('h2', { text: `部員名簿（表示中 ${list.length}人）` }));
    if (!list.length) card.append(h('div', { class: 'note', text: '表示中の部員がいません。上のフォームか、CSVで登録してください。' }));
    list.forEach((m, i) => {
      const row = h('div', { class: 'mrow', 'data-id': m.id });
      if (st.editing === m.id) {
        const n = h('input', { type: 'text', value: m.name, maxlength: 40, class: 'eName' }), k = h('input', { type: 'text', value: m.kana || '', maxlength: 80, class: 'eKana' }), g = gradeSelect('', m.grade);
        g.className = 'eGrade';
        row.append(h('div', { class: 'frm' }, fieldBox('氏名', n), fieldBox('ふりがな', k), fieldBox('学年', g)),
          h('div', { class: 'btns' }, h('button', { class: 'eSave', disabled: st.busy, onclick: () => run(async () => { await ops.update(m.id, { name: n.value, kana: k.value, grade: g.value }); st.editing = null; }, '保存しました') }, '保存'), h('button', { onclick: () => { st.editing = null; say(''); render(); } }, 'キャンセル')));
      } else if (st.hiding === m.id) {
        const sel = h('select', { class: 'hReason' }, HIDDEN_REASONS.map(r => h('option', { value: r }, r)));
        row.append(h('div', {}, h('div', { class: 'nm', text: m.name }), h('small', { text: '非表示にする理由' }), sel),
          h('div', { class: 'btns' }, h('button', { class: 'hOk', disabled: st.busy, onclick: () => run(async () => { await ops.hide(m.id, sel.value); st.hiding = null; }, '非表示にしました（記録は残ります）') }, '非表示にする'), h('button', { onclick: () => { st.hiding = null; render(); } }, 'キャンセル')));
      } else {
        row.append(h('div', {}, h('div', { class: 'nm', text: `${i + 1}. ${m.name}` }), h('small', { text: `${m.kana || 'ふりがな未設定'}　${gradeText(m.grade)}` })),
          h('div', { class: 'btns' },
            h('button', { class: 'up', 'aria-label': '上へ', disabled: !canEdit || st.busy || i === 0, onclick: () => run(() => ops.move(m.id, -1)) }, '↑'),
            h('button', { class: 'down', 'aria-label': '下へ', disabled: !canEdit || st.busy || i === list.length - 1, onclick: () => run(() => ops.move(m.id, 1)) }, '↓'),
            h('button', { class: 'edit', disabled: !canEdit || st.busy, onclick: () => { st.editing = m.id; st.hiding = null; say(''); render(); } }, '編集'),
            h('button', { class: 'hide', disabled: !canEdit || st.busy, onclick: () => { st.hiding = m.id; st.editing = null; say(''); render(); } }, '非表示')));
      }
      card.append(row);
    });
    return card;
  }

  function hiddenCard(list, canEdit) {
    if (!list.length) return null;
    const card = h('div', { class: 'card', id: 'hiddenCard' }, h('h2', { text: `非表示の部員（${list.length}人）` }), h('div', { class: 'note', text: '非表示でも過去の記録は残っています。再表示すると名簿の末尾に戻り、記録も復元されます。' }));
    for (const m of list) card.append(h('div', { class: 'mrow', 'data-id': m.id },
      h('div', {}, h('div', { class: 'nm', text: m.name }), h('small', { text: `${m.hiddenReason || ''}（${m.hiddenAt ? fmt(m.hiddenAt) : ''}）` })),
      h('div', { class: 'btns' }, h('button', { class: 'show', disabled: !canEdit || st.busy, onclick: () => run(() => ops.show(m.id), '再表示しました（名簿の末尾）') }, '再表示'))));
    return card;
  }

    card.append(h('div', { class: 'btns' }, h('button', { id: 'csvExport', disabled: !canEdit || st.busy, onclick: () => run(async () => { ops.exportCsv(st.includeHiddenExport); }, 'CSVを書き出しました') }, 'CSVを書き出す'), h('label', {}, inc, '非表示の部員も含める')));
    return card;

  function render() {
    const s = getState(), canEdit = s.canEdit && !s.syncing;

    root.append(addCard(canEdit), activeCard(sortActive(s.members.slice()), canEdit));
    const hc = hiddenCard(sortHidden(s.members.slice()), canEdit); if (hc) root.append(hc);

  let late = false; const t = setTimeout(() => { late = true; rej(new Error('応答がありません')); }, ms);

  }

  }
  $('shotCsv').onclick = () => { exportShotCsv(); };

  const rosterView = createRosterView({ doc, root: $('rosterView'), ops, getState: () => ({ members: roster, canEdit: !!db && !dbPending, syncing, reason: locked ? LOCK_MSG : dbPending ? '保存領域を準備中です' : '保存領域を使えないため、部員管理は表示のみです（' + (saveReason || '原因不明') + '）' }) });

  // 部員構成（有効部員IDの並び）が変わったときだけ、保存済みデータを読み直してStoreを作り直す（Undo履歴は切れる）
  async function rebuildStore(d, keepId) {
    const members = sortActive(roster.slice()).map(m => ({ id: m.id, name: m.name }));
    if (!members.length) { store = null; activeMembers = []; curSig = ''; savedJson = ''; unsaved = new Set(); return; }
    const saved = await withTimeout(loadShots(d, members.map(m => m.id)), timeoutMs), init = {};
    for (const m of members) init[m.id] = saved[m.id] || Array(SHOTS).fill(null);
    activeMembers = members; store = makeStore(activeMembers, init); curSig = configSignature(roster);
    savedJson = JSON.stringify(store.state.records); unsaved = new Set();
    const k = keepId ? members.findIndex(m => m.id === keepId) : -1;
    if (k > 0) store.goto(k);
  }
  async function syncStore() {
    if (!db || syncing) return;
    await Promise.allSettled([...inflight]);
    for (const m of roster) { const a = activeMembers.find(x => x.id === m.id); if (a) a.name = m.name; } // 氏名などの編集はStoreを作り直さず反映
    if (configSignature(roster) === curSig) { deferred = false; return; }
    if (unsavedNow()) { deferred = true; return; } // 未保存データがあるときは再生成しない
    syncing = true; render();
    try { await rebuildStore(db, store ? activeMembers[store.state.mi].id : null); deferred = false; say(''); }
    catch (e) { deferred = true; say(`部員の読み込みに失敗しました（${e && e.message || e}）`, true); }
    syncing = false;
  }
  async function showTab(t) {
    tab = t;
    if (t === 'roster') { rosterView.render(); render(); return; }
    render(); await syncStore(); render();
  }
  $('tabRec').onclick = () => showTab('rec');
  $('tabRoster').onclick = () => showTab('roster');

  // 画面の描画とボタン登録を先に済ませ、IndexedDBは後から非同期で準備する（応答しなくても画面は動く）
  render(); rosterView.render();
  const ready = (async () => {
    let d = null;
    try {
      d = await withTimeout(openDb({ idb, onBlocked: () => { blocked = true; say('他のタブやホーム画面のアプリを閉じてください（データベース更新待ち）', true); }, onVersionChange: () => {
        db = null; locked = true; drag = null; deferred = false; saveState = 'unavailable'; saveReason = '別のタブで保存領域が更新されました'; // 接続は openDb 側で閉じ済み。表示中の記録は消さない
        say(LOCK_MSG, true); render(); rosterView.render();
      } }), timeoutMs, late => late.close());
      roster = await withTimeout(listMembers(d), timeoutMs);
      await rebuildStore(d, null);
      db = d; saveState = 'ok'; say('');
    } catch (e) {
      if (d) { try { d.close(); } catch {} }
      saveState = 'unavailable'; saveReason = blocked ? '他のタブが使用中です' : `${e && e.name || ''} ${e && e.message || ''}`.trim() || '原因不明';
      say(`部員名簿を読み込めません（${saveReason}）。${blocked ? '他のタブやホーム画面のアプリを閉じて、' : ''}保存領域を確認し、再読み込みしてください`, true);
      // 名簿または保存済みの記録を正常に読めないときは、記録画面を使えない状態にする（仮名簿・一部だけの名簿では記録させない）
      store = null; activeMembers = []; curSig = ''; savedJson = ''; unsaved = new Set(); roster = [];
    }
    dbPending = false; render(); rosterView.render();
  })();
  return { ready, api: { getStore: () => store, exportShotCsv, getRoster: () => roster, getDb: () => db, showTab, ops, state: () => ({ saveState, saveReason, unsaved: new Set(unsaved), deferred, tab, syncing, dbPending }) } };
}

startApp();

</script>
</body></html>
